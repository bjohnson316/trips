<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetset Johnsons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#6366f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --eat:#e5484d; --play:#8b5cf6; --see:#14b8a6; --events:#f59e0b; --games:#3b82f6; --map:#6366f1; --plans:#ec4899;
  --radius:18px; --radius-sm:12px;
  --bg:#f7f7fb; --bg2:#ffffff; --card:#ffffff; --ink:#16161d; --ink2:#5b5b68; --line:rgba(20,20,30,.08);
  --glass:rgba(255,255,255,.72); --shadow:0 8px 30px rgba(20,20,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f0f16; --bg2:#16161f; --card:#1b1b26; --ink:#f2f2f6; --ink2:#9c9ca8; --line:rgba(255,255,255,.09);
  --glass:rgba(20,20,30,.6); --shadow:0 8px 30px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f16; --bg2:#16161f; --card:#1b1b26; --ink:#f2f2f6; --ink2:#9c9ca8; --line:rgba(255,255,255,.09);
    --glass:rgba(20,20,30,.6); --shadow:0 8px 30px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
a{color:inherit;}
.wrap{max-width:640px; margin:0 auto; padding:0 16px;}
.hidden{display:none !important;}

/* ---------- Gate screen ---------- */
#gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.gate-card{background:var(--card); border-radius:24px; padding:32px 24px; box-shadow:var(--shadow); width:100%; max-width:360px; text-align:center;}
.gate-logo{width:72px; height:72px; border-radius:20px; margin:0 auto 16px; display:block;}
.gate-card h1{font-size:24px; margin:0 0 4px; font-weight:800;}
.gate-card p{color:var(--ink2); margin:0 0 20px; font-size:14px;}
.field{text-align:left; margin-bottom:14px;}
.field label{font-size:12px; font-weight:600; color:var(--ink2); display:block; margin-bottom:6px;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg2); color:var(--ink);
  font-size:15px; font-family:inherit;
}
textarea{resize:vertical; min-height:60px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:14px; padding:12px 18px; font-weight:700; font-size:14px; cursor:pointer;
  background:var(--ink); color:var(--bg);
}
.btn.block{width:100%;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn.small{padding:8px 12px; font-size:13px; border-radius:10px;}
.btn:active{transform:scale(.97);}
.err{color:var(--eat); font-size:13px; margin-top:8px; min-height:16px;}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; backdrop-filter:blur(16px); background:var(--glass); border-bottom:1px solid var(--line);}
.topbar-inner{display:flex; align-items:center; gap:10px; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));}
.topbar .wordmark{font-weight:800; font-size:18px; flex:1;}
.iconbtn{width:36px; height:36px; border-radius:12px; border:1px solid var(--line); background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;}
.back{font-size:20px;}

/* ---------- Home ---------- */
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink2); margin:22px 0 10px;}
.city-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.city-tile{position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:3/4; cursor:pointer; box-shadow:var(--shadow);}
.city-tile .cover{position:absolute; inset:0;}
.city-tile .fade{position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75) 100%);}
.city-tile .meta{position:absolute; left:0; right:0; bottom:0; padding:12px; color:#fff;}
.city-tile .meta .name{font-weight:800; font-size:17px; line-height:1.1;}
.city-tile .meta .dates{font-size:12px; opacity:.85; margin-top:2px;}
.city-tile .badge{position:absolute; top:10px; left:10px; background:rgba(255,255,255,.92); color:#111; font-size:11px; font-weight:700; padding:4px 8px; border-radius:20px;}
.add-city-tile{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; border:2px dashed var(--line); border-radius:var(--radius); aspect-ratio:3/4; color:var(--ink2); cursor:pointer; font-weight:700; font-size:13px;}
.add-city-tile .plus{font-size:28px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--ink2);}

/* ---------- City hero ---------- */
.hero{position:relative; height:220px; border-radius:0 0 26px 26px; overflow:hidden; margin-bottom:6px;}
.hero .cover{position:absolute; inset:0;}
.hero .fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.7) 100%);}
.hero-content{position:absolute; left:16px; right:16px; bottom:16px; color:#fff;}
.hero-content h1{margin:0; font-size:26px; font-weight:800;}
.hero-pills{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.22); backdrop-filter:blur(6px); font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;}
.hero-photo-btn{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px;}

/* ---------- Tabs ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); pointer-events:none;}
.tabbar-inner{pointer-events:auto; display:flex; gap:2px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:20px; padding:6px; box-shadow:var(--shadow); max-width:96vw; overflow-x:auto;}
.tab-btn{display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:transparent; padding:8px 10px; border-radius:14px; font-size:10px; font-weight:700; color:var(--ink2); cursor:pointer; white-space:nowrap;}
.tab-btn .ic{font-size:17px;}
.tab-btn.active{background:var(--bg2); color:var(--ink);}
.tab-content{padding:14px 16px 110px;}

/* ---------- Cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
.card-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.card h3{margin:0; font-size:16px; font-weight:800;}
.card .sub{color:var(--ink2); font-size:13px; margin-top:2px;}
.chipline{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.chip{font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; background:var(--bg); border:1px solid var(--line); color:var(--ink2);}
.chip.status-loved{background:color-mix(in srgb, var(--eat) 15%, transparent); color:var(--eat); border-color:transparent;}
.chip.cat{color:#fff; border:none;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.day-heading{font-size:13px; font-weight:800; color:var(--ink2); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 8px;}
.day-heading:first-child{margin-top:0;}

/* ---------- Finder chips ---------- */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-bottom:6px;}
.vibe-chip{flex:0 0 auto; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--bg2); font-size:13px; font-weight:700; cursor:pointer; color:var(--ink);}
.vibe-chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

/* ---------- Illustrated covers ---------- */
.cover-ill{width:56px; height:56px; border-radius:14px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff;}

/* ---------- Bottom sheet ---------- */
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;}
.sheet{background:var(--bg2); width:100%; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 40px rgba(0,0,0,.25);}
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
.sheet h2{margin:0 0 14px; font-size:19px; font-weight:800;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.sheet-actions{display:flex; gap:10px; margin-top:16px;}
.sheet-actions .btn{flex:1;}

/* ---------- Loading / misc ---------- */
.spinner{width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--ink); animation:spin .8s linear infinite; margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.muted{color:var(--ink2); font-size:13px;}
.link-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.link-chip{flex:0 0 auto; padding:9px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;}
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:80; box-shadow:var(--shadow);}
</style>
</head>
<body>

<div id="gate"></div>
<div id="app" class="hidden"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="firebase-bundle.js"></script>
<script>
/* =========================================================================
   State & storage
   ========================================================================= */
const LS = { fid:'jj_fid', name:'jj_name', theme:'jj_theme' };
let STATE = {
  familyId: localStorage.getItem(LS.fid) || '',
  name: localStorage.getItem(LS.name) || '',
  // No server in this version, so no AI suggestions or Google Places photos.
  config: { hasAI:false, hasMaps:false },
  unsub: null,
};

const CAT = {
  eat:{color:'var(--eat)', label:'Eat', icon:'🍽️'},
  play:{color:'var(--play)', label:'Play', icon:'🎉'},
  see:{color:'var(--see)', label:'See', icon:'🧭'},
  events:{color:'var(--events)', label:'Events', icon:'🎫'},
  games:{color:'var(--games)', label:'Games', icon:'🏟️'},
};
const COVER_ICON = { museum:'🏛️', landmark:'🗽', park:'🌳', water:'🌊', neighborhood:'🏘️', market:'🛍️', experience:'✨' };
const GRADIENTS = [
  'linear-gradient(160deg,#6366f1,#ec4899)', 'linear-gradient(160deg,#14b8a6,#3b82f6)',
  'linear-gradient(160deg,#f59e0b,#e5484d)', 'linear-gradient(160deg,#8b5cf6,#14b8a6)',
  'linear-gradient(160deg,#3b82f6,#8b5cf6)', 'linear-gradient(160deg,#ec4899,#f59e0b)',
];

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
function gradientFor(id){ return GRADIENTS[hashStr(id)%GRADIENTS.length]; }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastHost').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* =========================================================================
   Firebase / Firestore data layer
   Data lives at families/{familyId}/cities/{cityId}. familyId is the SHA-256
   hash of the family code, so the code itself never leaves the device.
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBFvs8iiz_xhTODPcNOohTEJUEpXEs4v_Y",
  authDomain: "jetset-d5503.firebaseapp.com",
  projectId: "jetset-d5503",
  storageBucket: "jetset-d5503.firebasestorage.app",
  messagingSenderId: "471799585142",
  appId: "1:471799585142:web:833468d2ad00514276c257"
};

const PIN_DEFAULTS = {
  category:'see', title:'', note:'', url:'', when:'', status:'want', byName:'',
  lat:null, lng:null, placeId:null, rating:null, website:null, photoRef:null, menuUrl:null,
  tickets:false, tDate:'', tTime:'', tTz:'', tNote:'', remind:'1440,180',
  venue:'', evDate:'', evTime:''
};

// Starter trips, written into a brand-new family space the first time a code is used.
const SEED_CITIES = {"mujyc2ysi4iris":{"id":"mujyc2ysi4iris","name":"Boston","state":"MA","startDate":"2026-10-29","endDate":"2026-11-02","photoUrl":null,"photoIndex":0,"pins":{"mujyc31bostonia":{"id":"mujyc31bostonia","category":"eat","title":"Bostonia","note":"Clam Chowder","url":"","when":"","status":"want","byName":"","lat":null,"lng":null,"placeId":null,"rating":null,"website":null,"photoRef":null,"menuUrl":null,"tickets":false,"tDate":"","tTime":"","tTz":"","tNote":"","remind":"1440,180","venue":"","evDate":"","evTime":"","createdAt":"2026-09-01T00:00:00.000Z"}},"live":{"see":{"items":[{"name":"Freedom Trail","type":"landmark","blurb":"A 2.5-mile red-brick trail linking 16 historic sites through downtown Boston."},{"name":"Faneuil Hall Marketplace","type":"market","blurb":"Historic market hall with food stalls, shops, and street performers."},{"name":"Boston Public Garden","type":"park","blurb":"America's first public botanical garden — swan boats and the Make Way for Ducklings statues."},{"name":"Museum of Fine Arts","type":"museum","blurb":"One of the largest art museums in the US, with an encyclopedic collection."},{"name":"New England Aquarium","type":"water","blurb":"Harborside aquarium centered on a four-story ocean tank."},{"name":"Fenway Park","type":"landmark","blurb":"Home of the Red Sox and the oldest ballpark still in use in MLB."},{"name":"Boston Common","type":"park","blurb":"The oldest city park in the US, anchoring the start of the Freedom Trail."},{"name":"USS Constitution","type":"landmark","blurb":"The world's oldest commissioned warship still afloat, docked in Charlestown."},{"name":"Paul Revere House","type":"landmark","blurb":"Boston's oldest surviving structure, home of the famous midnight rider."},{"name":"Boston Tea Party Ships & Museum","type":"experience","blurb":"Interactive waterfront museum with a reenactment and replica ships."},{"name":"Harvard Square","type":"neighborhood","blurb":"Bookshops, cafes, and Harvard Yard just across the river in Cambridge."},{"name":"Quincy Market","type":"market","blurb":"Long domed market hall packed with New England food vendors."}],"at":"2026-09-01T00:00:00.000Z","note":""},"events":{"items":[],"at":null,"note":""},"games":{"items":[],"at":null,"note":""},"traditions":{"items":[],"at":null,"note":""}}},"mujyq2mcb4gyk1":{"id":"mujyq2mcb4gyk1","name":"Salem","state":"MA","startDate":"2026-10-31","endDate":"2026-10-31","photoUrl":null,"photoIndex":0,"pins":{},"live":{"see":{"items":[],"at":null,"note":""},"events":{"items":[],"at":null,"note":""},"games":{"items":[],"at":null,"note":""},"traditions":{"items":[],"at":null,"note":""}}}};

const fbApp = FB.initializeApp(FIREBASE_CONFIG);
let fsdb;
try {
  // Offline-friendly: reads are cached on the device and writes queue until you're back online.
  fsdb = FB.initializeFirestore(fbApp, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) });
} catch (e) {
  fsdb = FB.initializeFirestore(fbApp, {});
}

const nowISO = () => new Date().toISOString();
const clean = o => JSON.parse(JSON.stringify(o));          // Firestore rejects undefined values
const pick = (...vals) => vals.find(v => v !== undefined);
function genId(prefix){
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2,'0')).join('');
  return prefix + Date.now().toString(36) + rnd;
}
const cityCol = () => FB.collection(fsdb, 'families', STATE.familyId, 'cities');
const cityRef = id => FB.doc(fsdb, 'families', STATE.familyId, 'cities', id);
const metaRef = fid => FB.doc(fsdb, 'families', fid, 'meta', 'info');
function cityFromSnap(snap){
  const d = snap.data();
  d.id = snap.id; d.pins = d.pins || {}; d.live = d.live || {};
  return d;
}

const getCities = async () => (await FB.getDocs(cityCol())).docs.map(cityFromSnap);
async function getCity(id){
  const s = await FB.getDoc(cityRef(id));
  if (!s.exists()) throw new Error('City not found');
  return cityFromSnap(s);
}
async function putCity(id, body){
  const realId = id === 'new' ? genId('c') : id;
  let existing = {};
  if (id !== 'new'){ const s = await FB.getDoc(cityRef(realId)); if (s.exists()) existing = s.data(); }
  const city = {
    id: realId,
    name: pick(body.name, existing.name, ''), state: pick(body.state, existing.state, ''),
    startDate: pick(body.startDate, existing.startDate, ''), endDate: pick(body.endDate, existing.endDate, ''),
    photoUrl: pick(existing.photoUrl, null), photoIndex: pick(existing.photoIndex, 0),
    pins: existing.pins || {},
    live: existing.live || { see:{}, events:{}, games:{}, traditions:{} },
  };
  await FB.setDoc(cityRef(realId), clean(city));
  return city;
}
const patchCity = async (id, body) => { await FB.updateDoc(cityRef(id), clean(body)); return getCity(id); };
const delCity = id => FB.deleteDoc(cityRef(id));

async function putPin(cid, pid, body){
  const realPid = pid === 'new' ? genId('p') : pid;
  let existing = {};
  if (pid !== 'new'){
    const s = await FB.getDoc(cityRef(cid));
    if (!s.exists()) throw new Error('City not found');
    existing = (s.data().pins || {})[realPid] || {};
  }
  const pin = { id: realPid, createdAt: existing.createdAt || nowISO() };
  for (const k of Object.keys(PIN_DEFAULTS)) pin[k] = pick(body[k], existing[k], PIN_DEFAULTS[k]);
  await FB.updateDoc(cityRef(cid), { ['pins.' + realPid]: clean(pin) });
  return pin;
}
async function patchPin(cid, pid, body){
  const updates = {};
  for (const k of Object.keys(body)) if (body[k] !== undefined) updates[`pins.${pid}.${k}`] = body[k];
  await FB.updateDoc(cityRef(cid), updates);
  const s = await FB.getDoc(cityRef(cid));
  return (s.data().pins || {})[pid];
}
const delPin = (cid, pid) => FB.updateDoc(cityRef(cid), { ['pins.' + pid]: FB.deleteField() });
async function putLive(cid, kind, items, note){
  const entry = { items: clean(items || []), at: nowISO(), note: note || '' };
  await FB.updateDoc(cityRef(cid), { ['live.' + kind]: entry });
  return entry;
}
const NO_AI = "AI suggestions aren't turned on in this version yet.";
const refreshLive = async () => { throw new Error(NO_AI); };
const aiJSON = async () => { throw new Error(NO_AI); };
const cyclePhoto = async () => { throw new Error('City photos need a Google Places key, which this version does not use.'); };

/* ---------- family spaces ---------- */
async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const familyIdFor = code => sha256hex('jetset-johnsons:v1:' + code.trim().toLowerCase());
async function familyExists(fid){ return (await FB.getDoc(metaRef(fid))).exists(); }
async function createFamily(fid){
  const batch = FB.writeBatch(fsdb);
  batch.set(metaRef(fid), { createdAt: nowISO() });
  for (const c of Object.values(SEED_CITIES)) batch.set(FB.doc(fsdb, 'families', fid, 'cities', c.id), clean(c));
  await batch.commit();
}


/* =========================================================================
   Gate (family code + name)
   ========================================================================= */
function friendlyError(e){
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) return 'The database refused the request. Make sure the Firestore rules from the README are published.';
  if (code.includes('unavailable') || !navigator.onLine) return "Couldn't reach the database. Check your connection and try again.";
  return 'Something went wrong: ' + ((e && e.message) || e);
}
function gateShell(inner){
  document.getElementById('app').classList.add('hidden');
  const g = document.getElementById('gate');
  g.classList.remove('hidden');
  g.innerHTML = `<div class="gate-card"><img class="gate-logo" src="icon-192.png" alt="">${inner}</div>`;
}
function renderGate(err){
  gateShell(`
      <h1>Jetset Johnsons</h1>
      <p>Enter your family code to get in. Not case-sensitive.</p>
      <div class="field"><label>Family code</label><input type="password" id="gc-code" placeholder="At least 8 characters" autocomplete="off"></div>
      <div class="field"><label>Your name</label><input type="text" id="gc-name" placeholder="e.g. Jennifer"></div>
      <button class="btn block" id="gc-go">Let's go</button>
      <div class="err">${esc(err||'')}</div>
      <p class="muted" style="margin:10px 0 0;">This code is the only lock on your family's trips, so make it long and hard to guess.</p>`);
  document.getElementById('gc-name').value = STATE.name;
  const go = document.getElementById('gc-go');
  go.onclick = async ()=>{
    const code = document.getElementById('gc-code').value.trim();
    const name = document.getElementById('gc-name').value.trim();
    if (!code || !name){ renderGate('Enter both a code and your name.'); return; }
    if (code.length < 8){ renderGate('Use a code that is at least 8 characters.'); return; }
    go.disabled = true; go.textContent = 'Checking…';
    try{
      const fid = await familyIdFor(code);
      if (await familyExists(fid)) finishLogin(fid, name);
      else renderGateCreate(fid, name);
    }catch(e){ renderGate(friendlyError(e)); }
  };
}
function renderGateCreate(fid, name){
  gateShell(`
      <h1>Start a new family space?</h1>
      <p>Nobody has used that code yet. Create a new space with it? Everyone who enters this same code will share the same trips.</p>
      <p class="muted">If you meant to join an existing space, go back and re-check the code.</p>
      <button class="btn block" id="gc-create">Create family space</button>

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function countdownLabel(city){
  const startD = daysUntil(city.startDate), endD = daysUntil(city.endDate);
  if (endD < 0) return `${Math.abs(endD)}d ago`;
  if (startD <= 0 && endD >= 0) return 'Happening now';
  if (startD === 1) return 'Tomorrow!';
  return `in ${startD}d`;
}
function fmtRange(city){
  const opts = {month:'short', day:'numeric'};
  const s = new Date(city.startDate+'T00:00:00').toLocaleDateString('en-US', opts);
  const e = new Date(city.endDate+'T00:00:00').toLocaleDateString('en-US', opts);
  return s===e ? s : `${s} – ${e}`;
}
function skylineSVG(id, colorA, colorB){
  const seed = hashStr(id);
  let bars = '';
  let x = 0;
  for (let i=0; i<14; i++){
    const w = 14 + ((seed>>i)&7);
    const h = 40 + (((seed>>(i*2))%9) * 14);
    bars += `<rect x="${x}" y="${180-h}" width="${w-2}" height="${h}" fill="rgba(255,255,255,.18)"/>`;
    x += w;
    if (x>240) break;
  }
  return `<svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;">${bars}</svg>`;
}

/* ---------- Calendar file (.ics), built in the browser ---------- */
function zonedToUTC(dateStr, timeStr, tz){
  const [y, mo, d] = dateStr.split('-').map(Number);
  const [h, mi] = (timeStr || '00:00').split(':').map(Number);
  const target = Date.UTC(y, mo-1, d, h, mi);
  let guess = target;
  for (let i = 0; i < 3; i++){
    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz || 'UTC', hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    const parts = Object.fromEntries(fmt.formatToParts(new Date(guess)).map(p => [p.type, p.value]));
    const seen = Date.UTC(+parts.year, +parts.month-1, +parts.day, parts.hour === '24' ? 0 : +parts.hour, +parts.minute);
    const diff = target - seen;
    if (diff === 0) break;
    guess += diff;
  }
  return new Date(guess);
}
const icsDate = dt => dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
const icsEsc = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function buildICS(pin, city){
  const dateStr = pin.tDate || pin.evDate;
  if (!dateStr) return null;
  const start = zonedToUTC(dateStr, pin.tTime || pin.evTime || '00:00', pin.tTz || 'America/Chicago');
  const end = new Date(start.getTime() + 2*60*60*1000);
  const mins = String(pin.remind || '1440,180').split(',').map(s => parseInt(s.trim(), 10)).filter(n => !Number.isNaN(n));
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Jetset Johnsons//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${pin.id}@jetsetjohnsons`, `DTSTAMP:${icsDate(new Date())}`, `DTSTART:${icsDate(start)}`, `DTEND:${icsDate(end)}`,
    `SUMMARY:${icsEsc(pin.title)}`, `LOCATION:${icsEsc(pin.venue || city.name)}`, `DESCRIPTION:${icsEsc(pin.tNote || pin.note || '')}`];
  mins.forEach(m => lines.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(pin.title)}`,`TRIGGER:-PT${m}M`,'END:VALARM'));
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(pin){
  const ics = buildICS(pin, CUR_CITY);
  if (!ics){ toast('Add a date to this plan first'); return; }
  const url = URL.createObjectURL(new Blob([ics], { type:'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = (pin.title || 'event').replace(/[^a-z0-9]+/gi, '-') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

function gcalLink(p){
  const date = p.tDate || p.evDate; const time = p.tTime || p.evTime || '00:00';
  if (!date) return '#';
  const start = date.replace(/-/g,'') + 'T' + time.replace(':','') + '00';
  const [h,m] = time.split(':').map(Number);
  const endH = (h+2)%24; const end = date.replace(/-/g,'') + 'T' + String(endH).padStart(2,'0') + String(m).padStart(2,'0') + '00';
  const params = new URLSearchParams({
    action:'TEMPLATE', text:p.title||'', dates:`${start}/${end}`,
    details:p.tNote||p.note||'', location:p.venue||CUR_CITY.name, ctz:p.tTz||'America/Chicago',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

  const pins = Object.values(CUR_CITY.pins||{}).filter(p=>p.category==='eat');
  const finder = STATE.config.hasAI
    ? finderSection('eat', ['Must-try','Local classics','Date night','Brunch','Casual & cheap'])
    : searchChips([['Must-try','best restaurants'],['Local classics','classic local restaurants'],['Date night','date night restaurants'],['Brunch','brunch'],['Casual & cheap','cheap eats']])
      + `<div class="muted">These open Google Maps. Found somewhere good? Tap “Add a restaurant” to pin it for the whole family.</div>`;
  body.innerHTML = `
    <button class="btn block" id="addPinBtn" style="margin-bottom:12px;">+ Add a restaurant</button>
    ${pins.length?`<div class="section-title">Pinned</div>${pins.map(p=>pinCard(p)).join('')}`:''}
    <div class="section-title">Find restaurants</div>
    ${finder}
  `;
  wirePinCardActions(body);
  document.getElementById('addPinBtn').onclick = ()=> openPinSheet({category:'eat'});
  if (STATE.config.hasAI) wireFinder('eat', (vibe, city)=> `Suggest restaurants in ${city.name}, ${city.state} matching the vibe "${vibe}". Give real, specific restaurant names.`);
}

/* ---------- Explore tab ---------- */
function tabExplore(body){
  const pins = Object.values(CUR_CITY.pins||{}).filter(p=>p.category==='see');
  const list = (CUR_CITY.live && CUR_CITY.live.see && CUR_CITY.live.see.items) || [];
  const empty = STATE.config.hasAI
    ? `<button class="btn" id="genIdeas">Generate ideas</button>`
    : searchChips([['Top things to do','top things to do'],['Attractions','tourist attractions'],['Parks','parks'],['Museums','museums']]);
  body.innerHTML = `
    <button class="btn block" id="addPinBtn" style="margin-bottom:12px;">+ Add a place</button>
    ${pins.length?`<div class="section-title">Pinned</div>${pins.map(p=>pinCard(p)).join('')}`:''}
    <div class="section-title">Popular things to do</div>
    <div id="exploreList">${list.length ? list.map((it,i)=>exploreCard(it,i)).join('') : empty}</div>
  `;
  wirePinCardActions(body);
  document.getElementById('addPinBtn').onclick = ()=> openPinSheet({category:'see'});
  const gi = document.getElementById('genIdeas');
  if (gi) gi.onclick = async ()=>{
    const el = document.getElementById('exploreList'); el.innerHTML = `<div class="spinner"></div>`;
    try{
      const { json } = await aiJSON(
        `List 12 popular things to do in ${CUR_CITY.name}, ${CUR_CITY.state} for visitors. Mix museums, landmarks, parks, neighborhoods, markets, and experiences.`,
        'Respond with ONLY JSON: {"items":[{"name":"","type":"museum|landmark|park|water|neighborhood|market|experience","blurb":""}]}, exactly 12 items. No prose, no fences.'
      );
      const items = (json && json.items) || [];
      await putLive(CUR_CITY.id, 'see', items);
      CUR_CITY.live.see = {items};
      renderTab('explore');
    }catch(e){ el.innerHTML = `<div class="muted">Couldn't generate ideas: ${esc(e.message)}</div>`; }
  };
  body.querySelectorAll('[data-explore-pin]').forEach(b=>{
    b.onclick = async ()=>{
      const it = list[b.dataset.exploreIdx];
      const pin = await putPin(CUR_CITY.id, 'new', {category:'see', title:it.name, note:it.blurb||'', byName:STATE.name, status:'want'});
      CUR_CITY.pins[pin.id] = pin;
      toast('Pinned!'); b.textContent='Pinned ✓'; b.disabled = true;
    };
  });
}
function exploreCard(it,i){
  const icon = COVER_ICON[it.type] || '✨';
  const about = it.website || `https://www.google.com/search?q=${encodeURIComponent(it.name+' '+CUR_CITY.name)}`;
  return `<div class="card">
    <div class="card-row">
      <div class="cover-ill" style="background:${gradientFor(it.name+i)}">${icon}</div>
      <div style="flex:1;">
        <h3>${esc(it.name)}</h3>
        ${it.blurb?`<div class="sub">${esc(it.blurb)}</div>`:''}
      </div>
    </div>
    <div class="btnrow">
      <a class="btn small ghost" href="https://www.google.com/search?q=${encodeURIComponent(it.name)}&tbm=isch" target="_blank" rel="noopener">Photos</a>
      <a class="btn small ghost" href="${about}" target="_blank" rel="noopener">About</a>
      <a class="btn small ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.name+' '+CUR_CITY.name)}" target="_blank" rel="noopener">Directions</a>
      <button class="btn small" data-explore-pin data-explore-idx="${i}">Pin</button>
    </div>
  </div>`;
}

  const le = document.getElementById('loadEvents');
  if (le) le.onclick = async ()=>{
    document.getElementById('evList').innerHTML = `<div class="spinner"></div>`;

    openPlansSheet({category:'events', title:item.name, venue:item.venue, evDate:item.date, evTime:item.time, url:item.url});
  });
  const lt = document.getElementById('loadTrad');
  if (lt) lt.onclick = async ()=>{
    document.getElementById('tradList').innerHTML = `<div class="spinner"></div>`;
    try{
      const { json } = await aiJSON(
        `What yearly traditions, festivals, or seasonal happenings usually occur in ${CUR_CITY.name}, ${CUR_CITY.state} around ${CUR_CITY.startDate} to ${CUR_CITY.endDate} (any year)? `,
        'Respond with ONLY JSON: {"items":[{"name":"","blurb":""}]}, up to 6 items. No prose, no fences.'
      );
      const items = (json && json.items) || [];
      await putLive(CUR_CITY.id, 'traditions', items);
      CUR_CITY.live.traditions = {items};
      renderTab('events');
    }catch(e){ toast(e.message); renderTab('events'); }
  };
}
function eventCard(item, i){
  const when = item.date ? new Date(item.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  return `<div class="card">
    <h3>${esc(item.name)}</h3>
    <div class="sub">${when}${item.time?' · '+fmtTime12(item.time):''}${item.venue?' · '+esc(item.venue):''}</div>
    <div class="btnrow">
      ${item.url?`<a class="btn small ghost" href="${item.url}" target="_blank" rel="noopener">Details</a>`:''}
      <button class="btn small" data-ev-tix data-ev-idx="${i}">We have tickets</button>
    </div>
  </div>`;
}

function seasonBadge(league, city){
  const windows = {
    NFL: [[9,1,10,2]], NBA: [[10,1,4,2]], NHL: [[10,1,4,2]], MLB: [[4,1,9,2]],
  };
  // crude month-based check against trip start month
  const startMonth = new Date(city.startDate+'T00:00:00').getMonth()+1;
  const w = windows[league];
  if (!w) return '';
  const [sm] = w[0];
  const inSeason = league==='MLB' ? (startMonth>=4 && startMonth<=9) : (startMonth>=10 || startMonth<=2 || (league==='NFL' && startMonth===1));
  return inSeason ? '<span class="chip">In season</span>' : '<span class="chip">Off-season</span>';
}

/* ---------- Map tab ---------- */
function tabMap(body){
  const pins = Object.values(CUR_CITY.pins||{});
  const geoPins = pins.filter(p=>p.lat && p.lng);
  const cats = ['eat','play','see','events','games'];
  body.innerHTML = `
    <div class="chip-row" id="mapFilters">${cats.map(c=>`<button class="vibe-chip active" data-cat="${c}">${CAT[c].icon} ${CAT[c].label}</button>`).join('')}</div>
    <div class="card" style="padding:8px;"><svg id="mapSvg" viewBox="0 0 320 320" style="width:100%;height:auto;display:block;"></svg></div>
    <div id="mapCardHost"></div>
    ${pins.length ? `<button class="btn block" id="openAllMaps" style="margin-top:10px;">Open ${Math.min(pins.length,10)} stops in Google Maps</button>` : `<div class="muted">No pins yet — add some from the other tabs.</div>`}
  `;
  const svg = document.getElementById('mapSvg');
  const W=320,H=320, pad=30;
  let positions = {};
  if (geoPins.length >= 2){
    const lats = geoPins.map(p=>p.lat), lngs = geoPins.map(p=>p.lng);
    const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
    const spanLat = (maxLat-minLat)||0.01, spanLng=(maxLng-minLng)||0.01;
    pins.forEach(p=>{
      if (p.lat && p.lng){
        positions[p.id] = { x: pad + ((p.lng-minLng)/spanLng)*(W-2*pad), y: pad + (1-(p.lat-minLat)/spanLat)*(H-2*pad) };
      } else {
        const h = hashStr(p.id); positions[p.id] = { x: pad+(h%1000)/1000*(W-2*pad), y: pad+((h>>10)%1000)/1000*(H-2*pad) };
      }
    });
  } else {
    pins.forEach(p=>{ const h = hashStr(p.id); positions[p.id] = { x: pad+(h%1000)/1000*(W-2*pad), y: pad+((h>>10)%1000)/1000*(H-2*pad) }; });
  }
  let svgHtml = `<rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="var(--bg)"/>`;
  svgHtml += `<text x="12" y="20" font-size="11" fill="var(--ink2)">N ↑</text>`;
  svgHtml += `<line x1="14" y1="${H-16}" x2="64" y2="${H-16}" stroke="var(--ink2)" stroke-width="2"/><text x="14" y="${H-22}" font-size="9" fill="var(--ink2)">${geoPins.length>=2?'approx. scale':'positions approximate'}</text>`;
  pins.forEach(p=>{
    const pos = positions[p.id]; const color = (CAT[p.category]||CAT.see).color;
    svgHtml += `<circle cx="${pos.x}" cy="${pos.y}" r="7" fill="${color}" stroke="white" stroke-width="2" class="map-pin" data-pid="${p.id}" data-cat="${p.category}" style="cursor:pointer;"/>`;
  });
  svg.innerHTML = svgHtml;
  svg.querySelectorAll('.map-pin').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = CUR_CITY.pins[el.dataset.pid];
      document.getElementById('mapCardHost').innerHTML = pinCard(p);
      wirePinCardActions(document.getElementById('mapCardHost'));
    });
  });
  document.getElementById('mapFilters').querySelectorAll('.vibe-chip').forEach(chip=>{
    chip.onclick = ()=>{
      chip.classList.toggle('active');
      const activeCats = new Set([...document.querySelectorAll('#mapFilters .vibe-chip.active')].map(c=>c.dataset.cat));
      svg.querySelectorAll('.map-pin').forEach(el=> el.style.display = activeCats.has(el.dataset.cat) ? '' : 'none');
    };
  });
  if (document.getElementById('openAllMaps')) document.getElementById('openAllMaps').onclick = ()=>{
    const stops = pins.slice(0,10).map(p=> p.lat&&p.lng ? `${p.lat},${p.lng}` : encodeURIComponent(`${p.title} ${CUR_CITY.name}`));
    const dest = stops[stops.length-1]; const wps = stops.slice(0,-1).join('|');
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}${wps?'&waypoints='+wps:''}`, '_blank');
  };
}

function openPinSheet(pin){
  const isNew = !pin.id;
  const cat = CAT[pin.category] || CAT.see;
  openSheet(`
    <h2>${isNew ? 'Add to ' + cat.label : 'Edit pin'}</h2>
    <div class="field"><label>Name</label><input type="text" id="p-title" value="${escAttr(pin.title)}"></div>
    <div class="field"><label>Note</label><textarea id="p-note">${esc(pin.note||'')}</textarea></div>
    <div class="field"><label>Link (optional)</label><input type="url" id="p-url" value="${escAttr(pin.url||'')}"></div>
    <div class="field"><label>Status</label>
      <select id="p-status"><option value="want" ${pin.status!=='loved'?'selected':''}>Want</option><option value="loved" ${pin.status==='loved'?'selected':''}>Loved</option></select>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="p-cancel">Cancel</button><button class="btn" id="p-save">Save</button></div>
  `);
  document.getElementById('p-cancel').onclick = closeSheet;
  document.getElementById('p-save').onclick = async ()=>{
    const body = { title:document.getElementById('p-title').value.trim(), note:document.getElementById('p-note').value.trim(), url:document.getElementById('p-url').value.trim(), status:document.getElementById('p-status').value };
    if (!body.title){ toast('Give it a name first'); return; }
    if (isNew){
      const saved = await putPin(CUR_CITY.id, 'new', Object.assign({ category: pin.category || 'see', byName: STATE.name }, body));
      CUR_CITY.pins[saved.id] = saved; toast('Pinned!');
    } else {
      CUR_CITY.pins[pin.id] = await patchPin(CUR_CITY.id, pin.id, body);
    }
    updatePills(); closeSheet(); renderTab(currentRoute().tab);
  };
}

function openPlansSheet(pin){
  const isNew = !pin.id;
  openSheet(`
    <h2>${isNew?'We have tickets':'Reservation details'}</h2>
    <div class="field"><label>Title</label><input type="text" id="pl-title" value="${escAttr(pin.title||'')}"></div>
    <div class="field"><label>Venue</label><input type="text" id="pl-venue" value="${escAttr(pin.venue||'')}"></div>
    <div class="field-grid">
      <div class="field"><label>Date</label><input type="date" id="pl-date" value="${pin.tDate||pin.evDate||CUR_CITY.startDate||''}"></div>
      <div class="field"><label>Time</label><input type="time" id="pl-time" value="${pin.tTime||pin.evTime||''}"></div>
    </div>
    <div class="field"><label>Time zone</label>
      <select id="pl-tz">
        ${['America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Anchorage','Pacific/Honolulu'].map(tz=>`<option value="${tz}" ${(pin.tTz||guessTz())===tz?'selected':''}>${tz.replace('_',' ')}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Tickets / confirmation note</label><textarea id="pl-note">${esc(pin.tNote||'')}</textarea></div>
    <div class="field"><label>Reminders</label>
      <div class="chipline">
        ${[['10080','1 week'],['1440','1 day'],['180','3 hrs'],['60','1 hr']].map(([v,l])=>`<label class="chip" style="cursor:pointer;"><input type="checkbox" class="pl-remind" value="${v}" ${String(pin.remind||'1440,180').split(',').includes(v)?'checked':''} style="margin-right:4px;">${l}</label>`).join('')}
      </div>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="pl-cancel">Cancel</button><button class="btn" id="pl-save">Save</button></div>
    ${isNew ? '' : `<button class="btn ghost block" id="pl-delete" style="margin-top:10px;">Remove this plan</button>`}
  `);
  document.getElementById('pl-cancel').onclick = closeSheet;
  const del = document.getElementById('pl-delete');
  if (del) del.onclick = async ()=>{
    if (!confirm('Remove this plan and its pin?')) return;
    await delPin(CUR_CITY.id, pin.id); delete CUR_CITY.pins[pin.id];
    updatePills(); closeSheet(); renderTab(currentRoute().tab);
  };
  document.getElementById('pl-save').onclick = async ()=>{
    const remind = [...document.querySelectorAll('.pl-remind:checked')].map(c=>c.value).join(',') || '1440,180';
    const body = {
      category: pin.category || 'events', title: document.getElementById('pl-title').value.trim(),
      venue: document.getElementById('pl-venue').value.trim(), tickets:true,
      tDate: document.getElementById('pl-date').value, tTime: document.getElementById('pl-time').value,
      tTz: document.getElementById('pl-tz').value, tNote: document.getElementById('pl-note').value.trim(),
      remind, byName: STATE.name, status: pin.status || 'want', url: pin.url||'',
    };
    const pid = pin.id || 'new';
    const saved = await putPin(CUR_CITY.id, pid, body);
    CUR_CITY.pins[saved.id] = saved;
    updatePills(); closeSheet(); toast('Saved to Plans'); renderTab(currentRoute().tab);
  };
}
function guessTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch{ return 'America/Chicago'; } }

/* =========================================================================
   Utils
   ========================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* =========================================================================
   Render dispatcher & boot
   ========================================================================= */
function render(){
  if (!STATE.familyId){ renderGate(); return; }
  const r = currentRoute();
  if (r.view === 'city') renderCityPage(r.id, r.tab);
  else renderHome();
}

function startApp(){
  applyTheme();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render();
}

// Surface failed saves (e.g. Firestore rules not published) instead of failing silently.
window.addEventListener('unhandledrejection', e => {
  const r = e.reason; if (!r) return;
  toast(friendlyError(r));
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

(function init(){
  applyTheme();
  if (STATE.familyId && STATE.name) startApp();
  else renderGate();
})();
</script>
</body>
</html>
