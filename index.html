<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetset Johnsons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#6366f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --eat:#e5484d; --play:#8b5cf6; --see:#14b8a6; --events:#f59e0b; --games:#3b82f6; --map:#6366f1; --plans:#ec4899;
  --radius:18px; --radius-sm:12px;
  --bg:#f7f7fb; --bg2:#ffffff; --card:#ffffff; --ink:#16161d; --ink2:#5b5b68; --line:rgba(20,20,30,.08);
  --glass:rgba(255,255,255,.72); --shadow:0 8px 30px rgba(20,20,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f0f16; --bg2:#16161f; --card:#1b1b26; --ink:#f2f2f6; --ink2:#9c9ca8; --line:rgba(255,255,255,.09);
  --glass:rgba(20,20,30,.6); --shadow:0 8px 30px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f16; --bg2:#16161f; --card:#1b1b26; --ink:#f2f2f6; --ink2:#9c9ca8; --line:rgba(255,255,255,.09);
    --glass:rgba(20,20,30,.6); --shadow:0 8px 30px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
a{color:inherit;}
.wrap{max-width:640px; margin:0 auto; padding:0 16px;}
.hidden{display:none !important;}

/* ---------- Gate screen ---------- */
#gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.gate-card{background:var(--card); border-radius:24px; padding:32px 24px; box-shadow:var(--shadow); width:100%; max-width:360px; text-align:center;}
.gate-logo{width:72px; height:72px; border-radius:20px; margin:0 auto 16px; display:block;}
.gate-card h1{font-size:24px; margin:0 0 4px; font-weight:800;}
.gate-card p{color:var(--ink2); margin:0 0 20px; font-size:14px;}
.field{text-align:left; margin-bottom:14px;}
.field label{font-size:12px; font-weight:600; color:var(--ink2); display:block; margin-bottom:6px;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg2); color:var(--ink);
  font-size:15px; font-family:inherit;
}
textarea{resize:vertical; min-height:60px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:14px; padding:12px 18px; font-weight:700; font-size:14px; cursor:pointer;
  background:var(--ink); color:var(--bg);
}
.btn.block{width:100%;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn.small{padding:8px 12px; font-size:13px; border-radius:10px;}
.btn:active{transform:scale(.97);}
.err{color:var(--eat); font-size:13px; margin-top:8px; min-height:16px;}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; backdrop-filter:blur(16px); background:var(--glass); border-bottom:1px solid var(--line);}
.topbar-inner{display:flex; align-items:center; gap:10px; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));}
.topbar .wordmark{font-weight:800; font-size:18px; flex:1;}
.iconbtn{width:36px; height:36px; border-radius:12px; border:1px solid var(--line); background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;}
.back{font-size:20px;}

/* ---------- Home ---------- */
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink2); margin:22px 0 10px;}
.city-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.city-tile{position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:3/4; cursor:pointer; box-shadow:var(--shadow);}
.city-tile .cover{position:absolute; inset:0;}
.city-tile .fade{position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75) 100%);}
.city-tile .meta{position:absolute; left:0; right:0; bottom:0; padding:12px; color:#fff;}
.city-tile .meta .name{font-weight:800; font-size:17px; line-height:1.1;}
.city-tile .meta .dates{font-size:12px; opacity:.85; margin-top:2px;}
.city-tile .badge{position:absolute; top:10px; left:10px; background:rgba(255,255,255,.92); color:#111; font-size:11px; font-weight:700; padding:4px 8px; border-radius:20px;}
.add-city-tile{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; border:2px dashed var(--line); border-radius:var(--radius); aspect-ratio:3/4; color:var(--ink2); cursor:pointer; font-weight:700; font-size:13px;}
.add-city-tile .plus{font-size:28px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--ink2);}

/* ---------- City hero ---------- */
.hero{position:relative; height:220px; border-radius:0 0 26px 26px; overflow:hidden; margin-bottom:6px;}
.hero .cover{position:absolute; inset:0;}
.hero .fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.7) 100%);}
.hero-content{position:absolute; left:16px; right:16px; bottom:16px; color:#fff;}
.hero-content h1{margin:0; font-size:26px; font-weight:800;}
.hero-pills{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.22); backdrop-filter:blur(6px); font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;}
.hero-photo-btn{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px;}

/* ---------- Tabs ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); pointer-events:none;}
.tabbar-inner{pointer-events:auto; display:flex; gap:2px; background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:20px; padding:6px; box-shadow:var(--shadow); max-width:96vw; overflow-x:auto;}
.tab-btn{display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:transparent; padding:8px 10px; border-radius:14px; font-size:10px; font-weight:700; color:var(--ink2); cursor:pointer; white-space:nowrap;}
.tab-btn .ic{font-size:17px;}
.tab-btn.active{background:var(--bg2); color:var(--ink);}
.tab-content{padding:14px 16px 110px;}

/* ---------- Cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
.card-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.card h3{margin:0; font-size:16px; font-weight:800;}
.card .sub{color:var(--ink2); font-size:13px; margin-top:2px;}
.chipline{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.chip{font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; background:var(--bg); border:1px solid var(--line); color:var(--ink2);}
.chip.status-loved{background:color-mix(in srgb, var(--eat) 15%, transparent); color:var(--eat); border-color:transparent;}
.chip.cat{color:#fff; border:none;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.day-heading{font-size:13px; font-weight:800; color:var(--ink2); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 8px;}
.day-heading:first-child{margin-top:0;}

/* ---------- Finder chips ---------- */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-bottom:6px;}
.vibe-chip{flex:0 0 auto; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--bg2); font-size:13px; font-weight:700; cursor:pointer; color:var(--ink);}
.vibe-chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

/* ---------- Illustrated covers ---------- */
.cover-ill{width:56px; height:56px; border-radius:14px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff;}

/* ---------- Bottom sheet ---------- */
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;}
.sheet{background:var(--bg2); width:100%; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 40px rgba(0,0,0,.25);}
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
.sheet h2{margin:0 0 14px; font-size:19px; font-weight:800;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.sheet-actions{display:flex; gap:10px; margin-top:16px;}
.sheet-actions .btn{flex:1;}

/* ---------- Loading / misc ---------- */
.spinner{width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--ink); animation:spin .8s linear infinite; margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.muted{color:var(--ink2); font-size:13px;}
.link-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.link-chip{flex:0 0 auto; padding:9px 14px; border-radius:14px; background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;}
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:80; box-shadow:var(--shadow);}
</style>
</head>
<body>

<div id="gate"></div>
<div id="app" class="hidden"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* =========================================================================
   State & storage
   ========================================================================= */
const LS = { code:'jj_code', name:'jj_name', theme:'jj_theme' };
let STATE = {
  familyCode: localStorage.getItem(LS.code) || '',
  name: localStorage.getItem(LS.name) || '',
  cities: {},
  config: {},
  pollTimer: null,
};

const CAT = {
  eat:{color:'var(--eat)', label:'Eat', icon:'🍽️'},
  play:{color:'var(--play)', label:'Play', icon:'🎉'},
  see:{color:'var(--see)', label:'See', icon:'🧭'},
  events:{color:'var(--events)', label:'Events', icon:'🎫'},
  games:{color:'var(--games)', label:'Games', icon:'🏟️'},
};
const COVER_ICON = { museum:'🏛️', landmark:'🗽', park:'🌳', water:'🌊', neighborhood:'🏘️', market:'🛍️', experience:'✨' };
const GRADIENTS = [
  'linear-gradient(160deg,#6366f1,#ec4899)', 'linear-gradient(160deg,#14b8a6,#3b82f6)',
  'linear-gradient(160deg,#f59e0b,#e5484d)', 'linear-gradient(160deg,#8b5cf6,#14b8a6)',
  'linear-gradient(160deg,#3b82f6,#8b5cf6)', 'linear-gradient(160deg,#ec4899,#f59e0b)',
];

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
function gradientFor(id){ return GRADIENTS[hashStr(id)%GRADIENTS.length]; }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastHost').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* =========================================================================
   API
   ========================================================================= */
async function api(path, opts={}){
  const headers = Object.assign({'x-family-code': STATE.familyCode}, opts.body ? {'content-type':'application/json'} : {}, opts.headers||{});
  const r = await fetch('/api'+path, Object.assign({}, opts, { headers, body: opts.body ? JSON.stringify(opts.body) : undefined }));
  if (r.status === 401){ localStorage.removeItem(LS.code); location.reload(); throw new Error('unauthorized'); }
  const data = await r.json().catch(()=> ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const getCities = () => api('/cities');
const getCity = id => api('/cities/'+id);
const putCity = (id, body) => api('/cities/'+id, {method:'PUT', body});
const patchCity = (id, body) => api('/cities/'+id, {method:'PATCH', body});
const delCity = id => api('/cities/'+id, {method:'DELETE'});
const putPin = (cid, pid, body) => api(`/cities/${cid}/pins/${pid}`, {method:'PUT', body});
const patchPin = (cid, pid, body) => api(`/cities/${cid}/pins/${pid}`, {method:'PATCH', body});
const delPin = (cid, pid) => api(`/cities/${cid}/pins/${pid}`, {method:'DELETE'});
const putLive = (cid, kind, items, note) => api(`/cities/${cid}/live/${kind}`, {method:'PUT', body:{items, note}});
const refreshLive = (cid, kind) => api(`/cities/${cid}/refresh`, {method:'POST', body:{kind}});
const aiJSON = (prompt, system) => api('/ai', {method:'POST', body:{prompt, system}});
const cyclePhoto = cid => api(`/cities/${cid}/photo`, {method:'POST'});

/* =========================================================================
   Gate (family code + name)
   ========================================================================= */
function renderGate(err){
  document.getElementById('gate').innerHTML = `
    <div class="gate-card">
      <img class="gate-logo" src="icon-192.png" alt="">
      <h1>Jetset Johnsons</h1>
      <p>Enter your family code to get in.</p>
      <div class="field"><label>Family code</label><input type="password" id="gc-code" placeholder="Shared code"></div>
      <div class="field"><label>Your name</label><input type="text" id="gc-name" placeholder="e.g. Jennifer"></div>
      <button class="btn block" id="gc-go">Let's go</button>
      <div class="err">${err||''}</div>
    </div>`;
  document.getElementById('gc-code').value = STATE.familyCode;
  document.getElementById('gc-name').value = STATE.name;
  document.getElementById('gc-go').onclick = async ()=>{
    const code = document.getElementById('gc-code').value.trim();
    const name = document.getElementById('gc-name').value.trim();
    if (!code || !name){ renderGate('Enter both a code and your name.'); return; }
    STATE.familyCode = code; STATE.name = name;
    try{
      await api('/config');
      localStorage.setItem(LS.code, code); localStorage.setItem(LS.name, name);
      boot();
    }catch(e){ renderGate('Wrong code — try again.'); }
  };
}

/* =========================================================================
   Router
   ========================================================================= */
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'city' && parts[1]) return { view:'city', id:parts[1], tab:parts[2]||'plans' };
  return { view:'home' };
}
window.addEventListener('hashchange', render);

/* =========================================================================
   Theme
   ========================================================================= */
function applyTheme(){
  const t = localStorage.getItem(LS.theme);
  if (t) document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(LS.theme, next);
}

/* =========================================================================
   Sheets (bottom modal)
   ========================================================================= */
function openSheet(html, onMount){
  const host = document.getElementById('sheetHost');
  host.innerHTML = `<div class="sheet-overlay" id="ov"><div class="sheet"><div class="sheet-handle"></div>${html}</div></div>`;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeSheet(); });
  if (onMount) onMount(host);
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; }

/* =========================================================================
   HOME
   ========================================================================= */
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function countdownLabel(city){
  const startD = daysUntil(city.startDate), endD = daysUntil(city.endDate);
  if (endD < 0) return `${Math.abs(endD)}d ago`;
  if (startD <= 0 && endD >= 0) return 'Happening now';
  if (startD === 1) return 'Tomorrow!';
  return `in ${startD}d`;
}
function fmtRange(city){
  const opts = {month:'short', day:'numeric'};
  const s = new Date(city.startDate+'T00:00:00').toLocaleDateString('en-US', opts);
  const e = new Date(city.endDate+'T00:00:00').toLocaleDateString('en-US', opts);
  return s===e ? s : `${s} – ${e}`;
}
function skylineSVG(id, colorA, colorB){
  const seed = hashStr(id);
  let bars = '';
  let x = 0;
  for (let i=0; i<14; i++){
    const w = 14 + ((seed>>i)&7);
    const h = 40 + (((seed>>(i*2))%9) * 14);
    bars += `<rect x="${x}" y="${180-h}" width="${w-2}" height="${h}" fill="rgba(255,255,255,.18)"/>`;
    x += w;
    if (x>240) break;
  }
  return `<svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;">${bars}</svg>`;
}

async function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar"><div class="topbar-inner wrap" style="padding-left:0;padding-right:0;">
      <div class="wordmark">✈️ Jetset Johnsons</div>
      <button class="iconbtn" id="themeBtn">🌓</button>
    </div></div>
    <div class="wrap" id="homeBody"><div class="spinner"></div></div>`;
  document.getElementById('themeBtn').onclick = toggleTheme;

  let cities;
  try { cities = await getCities(); } catch(e){ document.getElementById('homeBody').innerHTML = `<div class="empty-state">Couldn't load trips.<br>${e.message}</div>`; return; }
  cities.sort((a,b)=> a.startDate.localeCompare(b.startDate));
  const upNext = cities.filter(c=> daysUntil(c.endDate) >= 0);
  const been = cities.filter(c=> daysUntil(c.endDate) < 0).reverse();

  function tile(c){
    return `<div class="city-tile" data-id="${c.id}">
      <div class="cover" style="background:${gradientFor(c.id)}">${skylineSVG(c.id)}</div>
      <div class="fade"></div>
      <div class="badge">${countdownLabel(c)}</div>
      <div class="meta"><div class="name">${esc(c.name)}</div><div class="dates">${fmtRange(c)}</div></div>
    </div>`;
  }

  const body = document.getElementById('homeBody');
  body.innerHTML = `
    ${upNext.length ? `<div class="section-title">Up next</div><div class="city-grid">${upNext.map(tile).join('')}<div class="add-city-tile" id="addTile"><div class="plus">+</div>Add a trip</div></div>` : `<div class="section-title">Up next</div><div class="city-grid"><div class="add-city-tile" id="addTile"><div class="plus">+</div>Add a trip</div></div>`}
    ${been.length ? `<div class="section-title">Been there</div><div class="city-grid">${been.map(tile).join('')}</div>` : ''}
  `;
  body.querySelectorAll('.city-tile').forEach(el=>{
    el.onclick = ()=>{ location.hash = `#/city/${el.dataset.id}`; };
  });
  document.getElementById('addTile').onclick = openAddCitySheet;
}

function openAddCitySheet(){
  openSheet(`
    <h2>Add a trip</h2>
    <div class="field"><label>City</label><input type="text" id="nc-name" placeholder="e.g. Austin"></div>
    <div class="field"><label>State</label><input type="text" id="nc-state" placeholder="e.g. TX"></div>
    <div class="field-grid">
      <div class="field"><label>Start date</label><input type="date" id="nc-start"></div>
      <div class="field"><label>End date</label><input type="date" id="nc-end"></div>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="nc-cancel">Cancel</button><button class="btn" id="nc-save">Save trip</button></div>
  `);
  document.getElementById('nc-cancel').onclick = closeSheet;
  document.getElementById('nc-save').onclick = async ()=>{
    const name = document.getElementById('nc-name').value.trim();
    const state = document.getElementById('nc-state').value.trim();
    const startDate = document.getElementById('nc-start').value;
    const endDate = document.getElementById('nc-end').value || startDate;
    if (!name || !startDate){ toast('Add at least a city and start date'); return; }
    const city = await putCity('new', {name, state, startDate, endDate});
    closeSheet();
    location.hash = `#/city/${city.id}`;
  };
}

/* =========================================================================
   CITY PAGE
   ========================================================================= */
const TABS = [
  {id:'plans', label:'Plans', icon:'🗓️'}, {id:'eat', label:'Eat', icon:'🍽️'}, {id:'play', label:'Play', icon:'🎉'},
  {id:'explore', label:'Explore', icon:'🧭'}, {id:'events', label:'Events', icon:'🎫'}, {id:'sports', label:'Sports', icon:'🏟️'}, {id:'map', label:'Map', icon:'🗺️'},
];

let CUR_CITY = null;

async function renderCityPage(id, tab){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="spinner" style="margin-top:80px;"></div>`;
  let city;
  try{ city = await getCity(id); } catch(e){ app.innerHTML = `<div class="wrap empty-state">Trip not found.<br><a href="#/">Go home</a></div>`; return; }
  CUR_CITY = city;

  const pins = Object.values(city.pins||{});
  const bookedCount = pins.filter(p=>p.tickets).length;
  const grad = gradientFor(city.id);

  app.innerHTML = `
    <div class="hero">
      <div class="cover" style="${city.photoUrl ? `background-image:url('${city.photoUrl}');background-size:cover;background-position:center;` : `background:${grad}`}">${city.photoUrl?'':skylineSVG(city.id)}</div>
      <div class="fade"></div>
      <button class="iconbtn hero-photo-btn" id="backBtn" style="left:12px;right:auto;position:absolute;background:rgba(255,255,255,.25);color:#fff;border-color:transparent;">←</button>

    </div>
    <div class="tab-content wrap" id="tabBody"></div>

  `;

    toast('Finding a photo…');
    try{ await cyclePhoto(city.id); renderCityPage(id, tab); } catch(e){ toast(e.message); }
  };

  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map(t=>`<button class="tab-btn ${t.id===tab?'active':''}" data-tab="${t.id}"><span class="ic">${t.icon}</span>${t.label}</button>`).join('');
  bar.querySelectorAll('.tab-btn').forEach(b=> b.onclick = ()=>{ location.hash = `#/city/${id}/${b.dataset.tab}`; });

  renderTab(tab);
  startPolling(id, tab);
}

function startPolling(id, tab){
  if (STATE.pollTimer) clearInterval(STATE.pollTimer);
  STATE.pollTimer = setInterval(async ()=>{
    if (currentRoute().view !== 'city' || currentRoute().id !== id) { clearInterval(STATE.pollTimer); return; }
    try{
      const fresh = await getCity(id);
      if (JSON.stringify(fresh) !== JSON.stringify(CUR_CITY)){
        CUR_CITY = fresh;
        renderTab(currentRoute().tab || 'plans');
      }
    }catch(e){ /* ignore transient errors */ }
  }, 20000);
}

function renderTab(tab){
  const body = document.getElementById('tabBody');
  if (!body) return;
  const fns = { plans:tabPlans, eat:tabEat, play:tabPlay, explore:tabExplore, events:tabEvents, sports:tabSports, map:tabMap };
  (fns[tab]||tabPlans)(body);
}

function mapsDirUrl(pin){
  const q = pin.lat && pin.lng ? `${pin.lat},${pin.lng}` : encodeURIComponent(`${pin.title} ${CUR_CITY?CUR_CITY.name:''}`);
  return `https://www.google.com/maps/dir/?api=1&destination=${q}`;
}
function wirePinCardActions(container){

/* ---------- Plans tab ---------- */
function fmtTime12(t){
  if (!t) return '';
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; h = h%12; if(h===0)h=12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function tabPlans(body){
  const pins = Object.values(CUR_CITY.pins||{}).filter(p=>p.tickets);
  if (!pins.length){
    body.innerHTML = `<div class="empty-state">No booked plans yet.<br><span class="muted">Mark restaurants, games, or events as reserved to see them here.</span></div>`;
    return;
  }
  const byDay = {};
  pins.forEach(p=>{ const d = p.tDate || p.evDate || 'Unscheduled'; (byDay[d] = byDay[d]||[]).push(p); });
  const days = Object.keys(byDay).sort();
  let html = '';
  days.forEach(d=>{
    const label = d==='Unscheduled' ? 'Unscheduled' : new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    html += `<div class="day-heading">${label}</div>`;
    byDay[d].sort((a,b)=> (a.tTime||a.evTime||'').localeCompare(b.tTime||b.evTime||'')).forEach(p=>{
      const time = p.tTime || p.evTime;
      const tz = p.tTz ? ` ${p.tTz.split('/').pop().replace('_',' ')}` : '';
      const icsHref = `/api/cities/${CUR_CITY.id}/pins/${p.id}/ics?c=${encodeURIComponent(STATE.familyCode)}`;
      const gcalHref = gcalLink(p);
      html += `
      <div class="card" data-pid="${p.id}">
        <div class="card-row">
          <div>
            <h3>${esc(p.title)}</h3>
            <div class="sub">${time?fmtTime12(time)+tz:''}${p.venue?' · '+esc(p.venue):''}</div>
            ${p.tNote ? `<div class="sub">${esc(p.tNote)}</div>` : ''}
            <div class="chipline"><span class="chip cat" style="background:${(CAT[p.category]||CAT.see).color}">${(CAT[p.category]||CAT.see).icon} ${(CAT[p.category]||CAT.see).label}</span></div>
          </div>
        </div>
        <div class="btnrow">
          <a class="btn small ghost" href="${mapsDirUrl(p)}" target="_blank" rel="noopener">Directions</a>
          <a class="btn small ghost" href="${icsHref}" target="_blank" rel="noopener">Add to calendar</a>
          <a class="btn small ghost" href="${gcalHref}" target="_blank" rel="noopener">Google Cal</a>
          <button class="btn small ghost" data-act="edit" data-pid="${p.id}">Edit</button>
        </div>
      </div>`;
    });
  });
  body.innerHTML = html + `<div class="muted" style="margin-top:14px;">Want these added to your phone's calendar? Ask Claude in chat to add your plans.</div>`;
  wirePinCardActions(body);
}
function gcalLink(p){
  const date = p.tDate || p.evDate; const time = p.tTime || p.evTime || '00:00';
  if (!date) return '#';
  const start = date.replace(/-/g,'') + 'T' + time.replace(':','') + '00';
  const [h,m] = time.split(':').map(Number);
  const endH = (h+2)%24; const end = date.replace(/-/g,'') + 'T' + String(endH).padStart(2,'0') + String(m).padStart(2,'0') + '00';
  const params = new URLSearchParams({
    action:'TEMPLATE', text:p.title||'', dates:`${start}/${end}`,
    details:p.tNote||p.note||'', location:p.venue||CUR_CITY.name, ctz:p.tTz||'America/Chicago',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

/* ---------- Generic finder (Eat / Play use this) ---------- */
function finderSection(catKey, chips, opts){
  return `
    <div class="chip-row" id="${catKey}Chips">
      ${chips.map((c,i)=>`<button class="vibe-chip ${i===0?'active':''}" data-vibe="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div id="${catKey}Results"></div>
  `;
}
async function runFinder(catKey, vibe, city, promptFn, resultsEl){
  resultsEl.innerHTML = `<div class="spinner"></div>`;
  if (!STATE.config.hasAI){ resultsEl.innerHTML = `<div class="muted">AI suggestions need ANTHROPIC_API_KEY set on the server.</div>`; return; }
  try{
    const { json } = await aiJSON(promptFn(vibe, city), 'Respond with ONLY JSON: {"items":[{"name":"","note":""}]}. 5-8 real, specific suggestions. No prose, no markdown fences.');
    const items = (json && json.items) || [];
    if (!items.length){ resultsEl.innerHTML = `<div class="muted">No suggestions came back — try another vibe.</div>`; return; }
    resultsEl.innerHTML = items.map((it,i)=>`
      <div class="card">
        <h3>${esc(it.name)}</h3>
        ${it.note?`<div class="sub">${esc(it.note)}</div>`:''}
        <div class="btnrow">
          <a class="btn small ghost" href="https://www.google.com/search?q=${encodeURIComponent(it.name+' '+city.name)}" target="_blank" rel="noopener">About</a>
          <button class="btn small" data-pin-idx="${i}">Pin it</button>
        </div>
      </div>`).join('');
    resultsEl.querySelectorAll('[data-pin-idx]').forEach(b=>{
      b.onclick = async ()=>{
        const it = items[b.dataset.pinIdx];
        const pin = await putPin(city.id, 'new', {category:catKey, title:it.name, note:it.note||'', byName:STATE.name, status:'want'});
        city.pins[pin.id] = pin;
        toast('Pinned!'); b.textContent='Pinned ✓'; b.disabled=true;
      };
    });
  }catch(e){ resultsEl.innerHTML = `<div class="muted">Couldn't get suggestions: ${esc(e.message)}</div>`; }
}
function wireFinder(catKey, promptFn){
  const chipRow = document.getElementById(catKey+'Chips');
  const resultsEl = document.getElementById(catKey+'Results');
  const go = vibe => runFinder(catKey, vibe, CUR_CITY, promptFn, resultsEl);
  chipRow.querySelectorAll('.vibe-chip').forEach(c=>{
    c.onclick = ()=>{ chipRow.querySelectorAll('.vibe-chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); go(c.dataset.vibe); };
  });
  go(chipRow.querySelector('.vibe-chip').dataset.vibe);
}

function seasonBadge(league, city){
  const windows = {
    NFL: [[9,1,10,2]], NBA: [[10,1,4,2]], NHL: [[10,1,4,2]], MLB: [[4,1,9,2]],
  };
  // crude month-based check against trip start month
  const startMonth = new Date(city.startDate+'T00:00:00').getMonth()+1;
  const w = windows[league];
  if (!w) return '';
  const [sm] = w[0];
  const inSeason = league==='MLB' ? (startMonth>=4 && startMonth<=9) : (startMonth>=10 || startMonth<=2 || (league==='NFL' && startMonth===1));
  return inSeason ? '<span class="chip">In season</span>' : '<span class="chip">Off-season</span>';
}
function tabSports(body){
  const nameLc = CUR_CITY.name.toLowerCase();
  const metro = METROS.find(m => m.aliases.some(a => nameLc.includes(a)));
  const games = (CUR_CITY.live && CUR_CITY.live.games && CUR_CITY.live.games.items) || [];
  body.innerHTML = `
    ${metro ? `<div class="section-title">Home teams</div>` + metro.teams.map(t=>`
      <div class="card">
        <div class="card-row">
          <div><h3>${esc(t.name)}</h3><div class="sub">${t.league}</div></div>
          ${seasonBadge(t.league, CUR_CITY)}
        </div>
        <div class="btnrow">
          <a class="btn small ghost" href="https://www.google.com/search?q=${encodeURIComponent(t.name+' schedule')}" target="_blank" rel="noopener">Schedule</a>
          <a class="btn small ghost" href="https://www.google.com/search?q=${encodeURIComponent(t.name+' tickets')}" target="_blank" rel="noopener">Tickets</a>
          <button class="btn small" data-pin-game data-league="${t.league}" data-team="${esc(t.name)}">Pin a game</button>
        </div>
      </div>`).join('') : `<div class="muted">No hardcoded teams for ${esc(CUR_CITY.name)} yet — ask Claude in chat to add this metro.</div>`}

    <div class="section-title">Confirmed games</div>
    <div id="gameList">${games.length ? games.map(gameCard).join('') : `<div class="muted">Nothing confirmed yet.</div>`}</div>
    <button class="btn ghost block" id="loadGames" style="margin-top:8px;">${STATE.config.hasAI ? 'Search for games' : 'Search needs server AI key'}</button>
  `;
  document.getElementById('loadGames').onclick = async ()=>{
    if (!STATE.config.hasAI) return;
    document.getElementById('gameList').innerHTML = `<div class="spinner"></div>`;
    try{ const r = await refreshLive(CUR_CITY.id, 'games'); CUR_CITY.live.games = r; renderTab('sports'); }
    catch(e){ toast(e.message); renderTab('sports'); }
  };
  body.querySelectorAll('[data-pin-game]').forEach(b=> b.onclick = ()=>{
    openPlansSheet({category:'games', title:`${b.dataset.team} game`, venue:'', evDate:CUR_CITY.startDate, evTime:''});
  });
  body.querySelectorAll('[data-game-tix]').forEach(b=> b.onclick = ()=>{
    const g = games[b.dataset.gameIdx];
    openPlansSheet({category:'games', title:g.matchup, venue:g.venue, evDate:g.date, evTime:g.time, url:g.url});
  });
}
function gameCard(g,i){
  const when = g.date ? new Date(g.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  return `<div class="card">
    <h3>${esc(g.matchup)}</h3>
    <div class="sub">${esc(g.league||'')} · ${when}${g.time?' · '+fmtTime12(g.time):''}${g.venue?' · '+esc(g.venue):''}</div>
    <div class="btnrow">
      ${g.url?`<a class="btn small ghost" href="${g.url}" target="_blank" rel="noopener">Details</a>`:''}
      <button class="btn small" data-game-tix data-game-idx="${i}">We have tickets</button>
    </div>
  </div>`;
}

/* ---------- Map tab ---------- */
function tabMap(body){
  const pins = Object.values(CUR_CITY.pins||{});
  const geoPins = pins.filter(p=>p.lat && p.lng);
  const cats = ['eat','play','see','events','games'];
  body.innerHTML = `
    <div class="chip-row" id="mapFilters">${cats.map(c=>`<button class="vibe-chip active" data-cat="${c}">${CAT[c].icon} ${CAT[c].label}</button>`).join('')}</div>
    <div class="card" style="padding:8px;"><svg id="mapSvg" viewBox="0 0 320 320" style="width:100%;height:auto;display:block;"></svg></div>
    <div id="mapCardHost"></div>
    ${pins.length ? `<button class="btn block" id="openAllMaps" style="margin-top:10px;">Open ${Math.min(pins.length,10)} stops in Google Maps</button>` : `<div class="muted">No pins yet — add some from the other tabs.</div>`}
  `;
  const svg = document.getElementById('mapSvg');
  const W=320,H=320, pad=30;
  let positions = {};
  if (geoPins.length >= 2){
    const lats = geoPins.map(p=>p.lat), lngs = geoPins.map(p=>p.lng);
    const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
    const spanLat = (maxLat-minLat)||0.01, spanLng=(maxLng-minLng)||0.01;
    pins.forEach(p=>{
      if (p.lat && p.lng){
        positions[p.id] = { x: pad + ((p.lng-minLng)/spanLng)*(W-2*pad), y: pad + (1-(p.lat-minLat)/spanLat)*(H-2*pad) };
      } else {
        const h = hashStr(p.id); positions[p.id] = { x: pad+(h%1000)/1000*(W-2*pad), y: pad+((h>>10)%1000)/1000*(H-2*pad) };
      }
    });
  } else {
    pins.forEach(p=>{ const h = hashStr(p.id); positions[p.id] = { x: pad+(h%1000)/1000*(W-2*pad), y: pad+((h>>10)%1000)/1000*(H-2*pad) }; });
  }
  let svgHtml = `<rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="var(--bg)"/>`;
  svgHtml += `<text x="12" y="20" font-size="11" fill="var(--ink2)">N ↑</text>`;
  svgHtml += `<line x1="14" y1="${H-16}" x2="64" y2="${H-16}" stroke="var(--ink2)" stroke-width="2"/><text x="14" y="${H-22}" font-size="9" fill="var(--ink2)">${geoPins.length>=2?'approx. scale':'positions approximate'}</text>`;
  pins.forEach(p=>{
    const pos = positions[p.id]; const color = (CAT[p.category]||CAT.see).color;
    svgHtml += `<circle cx="${pos.x}" cy="${pos.y}" r="7" fill="${color}" stroke="white" stroke-width="2" class="map-pin" data-pid="${p.id}" data-cat="${p.category}" style="cursor:pointer;"/>`;
  });
  svg.innerHTML = svgHtml;
  svg.querySelectorAll('.map-pin').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = CUR_CITY.pins[el.dataset.pid];
      document.getElementById('mapCardHost').innerHTML = pinCard(p);
      wirePinCardActions(document.getElementById('mapCardHost'));
    });
  });
  document.getElementById('mapFilters').querySelectorAll('.vibe-chip').forEach(chip=>{
    chip.onclick = ()=>{
      chip.classList.toggle('active');
      const activeCats = new Set([...document.querySelectorAll('#mapFilters .vibe-chip.active')].map(c=>c.dataset.cat));
      svg.querySelectorAll('.map-pin').forEach(el=> el.style.display = activeCats.has(el.dataset.cat) ? '' : 'none');
    };
  });
  if (document.getElementById('openAllMaps')) document.getElementById('openAllMaps').onclick = ()=>{
    const stops = pins.slice(0,10).map(p=> p.lat&&p.lng ? `${p.lat},${p.lng}` : encodeURIComponent(`${p.title} ${CUR_CITY.name}`));
    const dest = stops[stops.length-1]; const wps = stops.slice(0,-1).join('|');
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}${wps?'&waypoints='+wps:''}`, '_blank');
  };
}

/* =========================================================================
   Pin sheet (generic edit) & Plans sheet (booking details)
   ========================================================================= */
function openPinSheet(pin){
  openSheet(`
    <h2>Edit pin</h2>
    <div class="field"><label>Title</label><input type="text" id="p-title" value="${escAttr(pin.title)}"></div>
    <div class="field"><label>Note</label><textarea id="p-note">${esc(pin.note||'')}</textarea></div>
    <div class="field"><label>Link (optional)</label><input type="url" id="p-url" value="${escAttr(pin.url||'')}"></div>
    <div class="field"><label>Status</label>
      <select id="p-status"><option value="want" ${pin.status==='want'?'selected':''}>Want</option><option value="loved" ${pin.status==='loved'?'selected':''}>Loved</option></select>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="p-cancel">Cancel</button><button class="btn" id="p-save">Save</button></div>
  `);
  document.getElementById('p-cancel').onclick = closeSheet;
  document.getElementById('p-save').onclick = async ()=>{
    const body = { title:document.getElementById('p-title').value.trim(), note:document.getElementById('p-note').value.trim(), url:document.getElementById('p-url').value.trim(), status:document.getElementById('p-status').value };
    const updated = await patchPin(CUR_CITY.id, pin.id, body);
    CUR_CITY.pins[pin.id] = updated;
    closeSheet(); renderTab(currentRoute().tab);
  };
}

function openPlansSheet(pin){
  const isNew = !pin.id;
  openSheet(`
    <h2>${isNew?'We have tickets':'Reservation details'}</h2>
    <div class="field"><label>Title</label><input type="text" id="pl-title" value="${escAttr(pin.title||'')}"></div>
    <div class="field"><label>Venue</label><input type="text" id="pl-venue" value="${escAttr(pin.venue||'')}"></div>
    <div class="field-grid">
      <div class="field"><label>Date</label><input type="date" id="pl-date" value="${pin.tDate||pin.evDate||CUR_CITY.startDate||''}"></div>
      <div class="field"><label>Time</label><input type="time" id="pl-time" value="${pin.tTime||pin.evTime||''}"></div>
    </div>
    <div class="field"><label>Time zone</label>
      <select id="pl-tz">
        ${['America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Anchorage','Pacific/Honolulu'].map(tz=>`<option value="${tz}" ${(pin.tTz||guessTz())===tz?'selected':''}>${tz.replace('_',' ')}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Tickets / confirmation note</label><textarea id="pl-note">${esc(pin.tNote||'')}</textarea></div>
    <div class="field"><label>Reminders</label>
      <div class="chipline">
        ${[['10080','1 week'],['1440','1 day'],['180','3 hrs'],['60','1 hr']].map(([v,l])=>`<label class="chip" style="cursor:pointer;"><input type="checkbox" class="pl-remind" value="${v}" ${String(pin.remind||'1440,180').split(',').includes(v)?'checked':''} style="margin-right:4px;">${l}</label>`).join('')}
      </div>
    </div>
    <div class="sheet-actions"><button class="btn ghost" id="pl-cancel">Cancel</button><button class="btn" id="pl-save">Save</button></div>
  `);
  document.getElementById('pl-cancel').onclick = closeSheet;
  document.getElementById('pl-save').onclick = async ()=>{
    const remind = [...document.querySelectorAll('.pl-remind:checked')].map(c=>c.value).join(',') || '1440,180';
    const body = {
      category: pin.category || 'events', title: document.getElementById('pl-title').value.trim(),
      venue: document.getElementById('pl-venue').value.trim(), tickets:true,
      tDate: document.getElementById('pl-date').value, tTime: document.getElementById('pl-time').value,
      tTz: document.getElementById('pl-tz').value, tNote: document.getElementById('pl-note').value.trim(),
      remind, byName: STATE.name, status: pin.status || 'want', url: pin.url||'',
    };
    const pid = pin.id || 'new';
    const saved = await putPin(CUR_CITY.id, pid, body);
    CUR_CITY.pins[saved.id] = saved;
    closeSheet(); toast('Saved to Plans'); renderTab(currentRoute().tab);
  };
}
function guessTz(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch{ return 'America/Chicago'; } }

/* =========================================================================
   Utils
   ========================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* =========================================================================
   Render dispatcher & boot
   ========================================================================= */
function render(){
  const r = currentRoute();
  if (r.view === 'city') renderCityPage(r.id, r.tab);
  else renderHome();
}

async function boot(){
  applyTheme();
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try{ STATE.config = await api('/config'); }catch(e){ STATE.config = {}; }
  render();
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

(function init(){
  applyTheme();
  if (STATE.familyCode && STATE.name){
    api('/config').then(cfg=>{ STATE.config = cfg; document.getElementById('gate').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); render(); })
      .catch(()=> renderGate());
  } else {
    renderGate();
  }
})();
</script>
