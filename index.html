<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#F3F4F8;--surface:#FFFFFF;--surface2:#F7F8FB;--ink:#12131A;--muted:#636779;--line:#E3E5EC;--accent:#4F46E5;--accent-ink:#FFFFFF;
  --glass:rgba(255,255,255,.78);--shadow:0 1px 2px rgba(18,19,26,.06),0 8px 24px rgba(18,19,26,.06);
  --eat:#F2545B;--play:#A855F7;--see:#0EA5A4;--events:#F59E0B;--games:#3B82F6;--map:#4F46E5;
  --brand:linear-gradient(135deg,#06B6D4 0%,#6366F1 55%,#D946EF 100%);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E14;--surface:#171923;--surface2:#1D2030;--ink:#F1F2F7;--muted:#9A9FB2;--line:#272A39;--accent:#818CF8;--accent-ink:#0D0E14;
  --glass:rgba(23,25,35,.78);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --eat:#FB7185;--play:#C084FC;--see:#2DD4BF;--events:#FBBF24;--games:#60A5FA;--map:#818CF8;}}
:root[data-theme="dark"]{--bg:#0D0E14;--surface:#171923;--surface2:#1D2030;--ink:#F1F2F7;--muted:#9A9FB2;--line:#272A39;--accent:#818CF8;--accent-ink:#0D0E14;
  --glass:rgba(23,25,35,.78);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --eat:#FB7185;--play:#C084FC;--see:#2DD4BF;--events:#FBBF24;--games:#60A5FA;--map:#818CF8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);font-size:14px}

/* Brand */
.brand{display:flex;align-items:center;gap:12px;padding:22px 0 6px}
.logo{width:48px;height:48px;border-radius:14px;flex:none;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.wordmark{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tag{color:var(--muted);font-size:14px;margin-top:3px}
.h-label{font-size:15px;font-weight:600;color:var(--muted);margin:26px 2px 10px}

/* City tiles */
.tiles{display:grid;gap:12px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;border:0;border-radius:24px;padding:18px;color:#fff;text-align:left;box-shadow:var(--shadow);isolation:isolate}
.tile::before,.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,0,0,.25),transparent 55%)}
.tile::after,.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;z-index:-1;border-radius:50%;border:1.5px dashed rgba(255,255,255,.35)}
.tile .nm{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1;overflow-wrap:anywhere}
.tile .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;font-weight:500}
.pill{background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.tile.past{min-height:84px;opacity:.82}.tile.past .nm{font-size:24px}
.empty{padding:36px 4px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;border:0;border-radius:999px;padding:15px 22px;font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(99,102,241,.4);display:flex;gap:8px;align-items:center;z-index:6}

/* City hero */
.hero{position:relative;overflow:hidden;isolation:isolate;margin:12px 0 0;border-radius:28px;padding:14px 18px 22px;color:#fff;box-shadow:var(--shadow)}
.hero .bar{display:flex;justify-content:space-between}
.hbtn{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.city-name{font-size:clamp(44px,14vw,76px);font-weight:800;letter-spacing:-.05em;line-height:.92;margin:34px 0 14px;overflow-wrap:anywhere}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.hero .pill{border:0;color:#fff;font-size:14px;padding:7px 13px}

/* Sections */
.sec{margin-top:26px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.sec h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{color:var(--muted);font-size:14px;margin:3px 0 0}
.cards{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:40px 1fr;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.card .t{font-weight:700;font-size:17px;line-height:1.25;letter-spacing:-.01em}
.card .d{color:var(--muted);font-size:14px;margin-top:2px}
.card .who{font-size:12.5px;color:var(--muted);margin-top:6px}
.card .when{font-size:13px;font-weight:700;color:var(--c);margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip svg.i{width:15px;height:15px}
.chip.go{background:var(--c,var(--accent));border-color:transparent;color:#fff}
.chip.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:transparent;color:var(--c)}
.chip.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;gap:8px}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.55}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:18px;background:none;color:var(--c);font-weight:700;font-size:15.5px}
.note{color:var(--muted);font-size:14px;padding:6px 2px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c,var(--ink));border-color:transparent;color:#fff}
.team{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.in{background:color-mix(in srgb,var(--games) 16%,transparent);color:var(--games)}
.badge.post{background:color-mix(in srgb,var(--events) 18%,transparent);color:var(--events)}
.badge.off{background:var(--surface2);color:var(--muted)}
.league{font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 8px}

/* Photos */
.tile.photo{min-height:190px}
.tile.photo::after,.hero.photo::after{display:none}
.tile .cred{position:absolute;top:10px;right:14px;font-size:10.5px;opacity:.75}
.hero.photo{min-height:300px;display:flex;flex-direction:column}
.hero.photo .city-name{margin-top:auto;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero .credit{position:absolute;right:14px;bottom:8px;font-size:10.5px;color:#fff;opacity:.8;text-decoration:none}
.hero .bar .grp{display:flex;gap:6px}
.card.ph-card{display:block;padding:0;overflow:hidden}
.ph-wrap{position:relative;aspect-ratio:16/9;background:color-mix(in srgb,var(--c) 14%,var(--surface2))}
.ph-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.ph-cred{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:1px 6px;border-radius:6px}
.ph-rate{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#12131A;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.ph-body{padding:12px 14px 13px}

/* Map */
.mapbox{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox .grid{stroke:var(--line);stroke-width:1}
.mapbox .lbl{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.mapbox .scale{font-size:10px;fill:var(--muted);font-weight:600}
.pinmark{cursor:pointer}
.pinmark path{transition:transform .15s}
.sel-card{margin-top:10px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 10px env(safe-area-inset-bottom,0px);background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.nav button svg.i{width:22px;height:22px}
.nav button .ib{padding:4px 12px;border-radius:999px;display:grid;place-items:center}
.nav button[aria-selected="true"]{color:var(--c)}
.nav button[aria-selected="true"] .ib{background:color-mix(in srgb,var(--c) 16%,transparent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,9,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px}
.danger{background:none;border:0;color:var(--eat);font-weight:700;padding:12px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;white-space:nowrap}

/* Map (Leaflet) */
.mapbox{isolation:isolate}   /* keep Leaflet's high z-index panes and controls underneath the bottom nav, sheets and toasts */
.mapbox .leaflet-container{font-family:inherit;background:var(--surface2)}
#mapslot,#jjmap{height:clamp(320px,58vh,520px)}
.jm-wrap{background:none!important;border:0!important}
.jm{position:relative;width:28px;height:36px}
.jm svg{display:block;width:28px;height:36px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transform-origin:50% 100%;transition:transform .15s}
.jm.sel svg{transform:scale(1.28)}
.jm .jl{position:absolute;left:29px;top:5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 5px #000;pointer-events:none}
.leaflet-control-attribution{font-size:10px!important}
</style>
</head>

function pinsOf(k){return S.pins.filter(p=>p.cat===k).sort((a,b)=>(b.at||0)-(a.at||0))}
function pinCard(p,c){
  const loved=p.status==="loved";
  const inner=`${p.when?`<div class="when">${esc(p.when)}</div>`:""}<div class="t">${esc(p.title)}</div>
  ${p.note?`<div class="d">${esc(p.note)}</div>`:""}
  <div class="who">Pinned by ${esc(p.byName&&p.byName===API.name?"you":(p.byName||"someone"))}</div>
  <div class="acts">
    <a class="chip go" href="${esc(dirs(p.title,c.name))}" target="_blank" rel="noopener">${ico("dir")}Directions</a>
    ${extraLinks(p,p.cat,c)}
    <button class="chip ${loved?"on":""}" data-act="status" data-id="${p.id}">${ico("heart")}${loved?"Loved it":"Want to go"}</button>
    ${p.url?`<a class="chip" href="${esc(p.url)}" target="_blank" rel="noopener">${ico("link")}Link</a>`:""}
    <button class="chip quiet" data-act="delPin" data-id="${p.id}">Remove</button>
  </div>`;

}
function pinsSection(k,c,title,sub,addLabel){
  const ps=pinsOf(k);
  return `<section class="sec"><div class="sec-head"><div><h2>${title}</h2><p class="sub">${sub}</p></div></div>
  ${ps.length?`<ul class="cards">${ps.map(p=>pinCard(p,c)).join("")}</ul>`:(addLabel?"":`<p class="note">Nothing pinned yet.</p>`)}
  ${addLabel?`<button class="add" data-act="addPin" data-k="${k}">${ico("plus")}${addLabel}</button>`:""}</section>`;
}
function when(ts){return ts?new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}
const SEARCH={eat_best:"best restaurants",eat_local:"classic local restaurants",eat_date:"date night restaurants",eat_brunch:"brunch spots",eat_casual:"cheap eats",play:"live music, comedy and nightlife",see:"top things to do",annual:"annual festivals and events"};
function searchLink(kind,c){
  const q=SEARCH[kind];if(!q)return "";
  const url=kind==="annual"?g(q+" in "+c.name+" "+monthsLabel(c)):mapsQ(q,c.name);
  return `<a class="chip go" href="${esc(url)}" target="_blank" rel="noopener">${ico(kind==="annual"?"events":"map")}Search “${esc(q)}”${kind==="annual"?"":" on Google Maps"}</a><p class="note" style="margin-top:8px">Found something good? Pin it above so the whole family sees it. <button class="chip quiet" data-act="setupOpen">${S.aiLocked?"Unlock AI suggestions":"Turn on AI suggestions"}</button></p>`;
}
function aiBtn(kind,label){
  if(!S.ready)return "";
  if(!S.ai){const c=city();return c?searchLink(kind,c):""}
  const b=S.busy[kind];
  return `<button class="btn ${S.live[kind]?"soft":""}" data-act="ai" data-kind="${kind}" ${b?"disabled":""}>${ico("spark")}${b?"Finding…":esc(S.live[kind]?"Refresh":label)}</button>`;
}
function suggestCard(it,i,src,cat,c){
  const pinned=S.pins.some(p=>p.cat===cat&&p.title===it.name);
  const inner=`<div class="t">${esc(it.name)}</div>${it.kind?`<div class="when" style="margin:2px 0 0">${esc(it.kind)}</div>`:""}
   <div class="d">${esc(it.why)}</div>${it.area?`<div class="who">${esc(it.area)}</div>`:""}
   <div class="acts">${pinned?`<span class="chip on">${ico("pin")}Pinned</span>`:`<button class="chip go" data-act="pinFrom" data-src="${src}" data-i="${i}">${ico("pin")}Pin</button>`}
   ${extraLinks(it,cat,c)}
   <a class="chip" href="${esc(dirs(it.name,c.name))}" target="_blank" rel="noopener">${ico("dir")}Directions</a></div>`;

}
function discover(kind,cat,c,title,sub,btn,extra=""){
  const L=S.live[kind];
  return `<section class="sec"><div class="sec-head"><div><h2>${title}</h2><p class="sub">${L?"Updated "+when(L.at)+". Tap Pin to save one for the family.":(S.ai?sub:"Search Google Maps, then pin what the family likes.")}</p></div></div>${extra}
  ${L?.items?.length?`<ul class="cards">${L.items.map((it,i)=>suggestCard(it,i,kind,cat,c)).join("")}</ul>`:""}
  <div style="margin-top:12px">${aiBtn(kind,btn)}</div></section>`;

function tabHTML(c){
  switch(S.tab){
  case "eat":{
    const st=EAT_STYLES.find(s=>s.k===S.eatStyle)||EAT_STYLES[0];
    const seg=`<div class="seg" style="--c:var(--eat)">${EAT_STYLES.map(s=>`<button aria-pressed="${s.k===st.k}" data-act="eatStyle" data-k="${s.k}">${s.l}</button>`).join("")}</div>`;
    return pinsSection("eat",c,"Our restaurants","Loved it, or want to try it. Anyone can add.","Pin a restaurant")+
      discover("eat_"+st.k,"eat",c,"Find restaurants","Pick a vibe, then load the city's standouts.","Find "+st.l.toLowerCase()+" spots",seg);
  }
  case "play":return pinsSection("play",c,"Our fun spots","Shows, bars, rooftops, nightlife.","Pin a spot")+
      discover("play","play",c,"Find entertainment","Live music, comedy, bars, shows and nightlife.","Find things to do at night");
  case "see":return pinsSection("see",c,"Our sights","Saved from below or added by hand.","Add a sight")+
      discover("see","see",c,"Popular things to do","Landmarks, museums, neighborhoods and outdoors.","Find things to do in "+c.name);
  case "events":return pinsSection("events",c,"Our events","Concerts, festivals and shows to catch.","Add an event")+eventsHTML(c);
  case "games":return pinsSection("games",c,"Our games","Games we're going to, or want to.",null)+sportsHTML(c);

function liveBtn(kind,c,label){
  if(!S.ai)return "";
  if(!c.start)return `<p class="note" style="margin-top:10px">Add trip dates to load a live list.</p>`;
  const b=S.busy["r_"+kind],has=S.live[kind];
  return `<div style="margin-top:12px"><button class="btn ${has?"soft":""}" data-act="refresh" data-kind="${kind}" ${b?"disabled":""}>${ico("spark")}${b?"Searching the web. This takes about a minute…":esc(has?"Check again":label)}</button></div>`;
}
async function refreshLive(kind){
  const c=city();if(!c||S.busy["r_"+kind])return;
  S.busy["r_"+kind]=true;render();
  try{
    if(!c.start)throw Object.assign(new Error("no dates"),{code:"no_dates"});
    const s=c.start,e=c.end||s,L={month:"long",day:"numeric",year:"numeric"},span=s===e?fmt(s,L):fmt(s,L)+" to "+fmt(e,L);
    const prompt=kind==="events"
      ?`Search the web for real, scheduled public events in or near ${c.name} between ${s} and ${e} (${span}): concerts, festivals, theater and comedy shows, exhibitions and seasonal events. Only include events you found a real listing for. Reply with only a JSON array of objects: {"name": string, "date": "YYYY-MM-DD", "time": string (local, like "7:30 PM", or ""), "venue": string, "url": string (the listing, or "")}. Reply [] if you find none.`
      :`Search official league schedules for professional and major college games played in or near ${c.name} between ${s} and ${e} (${span}). Only include games you found on a real schedule. Reply with only a JSON array of objects: {"league": string, "matchup": string (like "Celtics vs Knicks"), "date": "YYYY-MM-DD", "time": string (local, like "7:30 PM", or ""), "venue": string, "url": string (the schedule or ticket page, or "")}. Reply [] if you find none.`;
    const raw=await aiSearchJSON(prompt);
    const str=v=>String(v==null?"":v);
    const items=raw.filter(x=>x&&typeof x==="object"&&/^\d{4}-\d{2}-\d{2}$/.test(str(x.date))&&inRange(x.date,c)).slice(0,40).map(x=>kind==="events"
      ?{name:str(x.name),date:x.date,time:str(x.time),venue:str(x.venue),url:str(x.url)}
      :{league:str(x.league),matchup:str(x.matchup),date:x.date,time:str(x.time),venue:str(x.venue),url:str(x.url)}).filter(x=>kind==="events"?x.name:x.matchup);
    await store.setLive(c.id,kind,{items,at:Date.now(),note:""});
    toast(items.length?`Found ${items.length}`:"Nothing found for those dates");
  }catch(err){toast(aiErrText(err,"Couldn't load right now. Try again."))}
  finally{S.busy["r_"+kind]=false;render()}
}

    <div class="acts">${pinned?`<span class="chip on">${ico("pin")}Pinned</span>`:`<button class="chip go" data-act="pinFrom" data-src="annual" data-i="${i}">${ico("pin")}Pin</button>`}<a class="chip" href="${esc(g(it.name+" "+c.name+" "+(c.start||today()).slice(0,4)+" dates"))}" target="_blank" rel="noopener">Check dates</a></div></div></li>`}).join("")}</ul>`:A?`<p class="note">No recurring events usually fall in this window.</p>`:""}
  <div style="margin-top:12px">${aiBtn("annual","Find yearly events")}</div></section>`;

  const lgs=LEAGUES.filter(l=>m[l]).map(l=>({l,st:seasonStatus(l,c.start,c.end)})).sort((a,b)=>"ipo".indexOf(a.st[0])-"ipo".indexOf(b.st[0]));
  h+=`<section class="sec"><div class="sec-head"><div><h2>${esc(m.n)} teams</h2><p class="sub">${c.start?"For "+esc(fmt(c.start))+(c.end?" – "+esc(fmt(c.end)):"")+".":"Add trip dates to see who's in season."} Tap Schedule for exact times.</p></div></div>`;
  lgs.forEach(({l,st})=>{

  MAPPTS=pts;
  const offMap=pins.filter(p=>!pts.includes(p)),untried=S.pins.filter(p=>!hasGeo(p)&&!p.geoTried&&["eat","play","see"].includes(p.cat));

    <button class="chip ${sat?"":"on"}" style="--c:var(--map)" data-act="mapStyle" data-k="streets" aria-pressed="${!sat}">Streets</button>
    <button class="chip" data-act="mapCity">${ico("map")}Whole city</button>
   </div>
   ${pts.length?"":`<p class="note" style="margin-top:8px">Pin restaurants and sights and they'll show up on the map.</p>`}
   ${pts.some(p=>p.geoSrc!=="osm")?`<p class="note" style="margin-top:8px">Pins saved from a suggestion use approximate positions. Ones you add by name are looked up on OpenStreetMap.</p>`:""}
   ${S.pins.some(p=>p.geoSrc==="osm")?`<p class="note" style="margin-top:8px">Some positions © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>.</p>`:""}
   ${sel?`<ul class="cards sel-card">${pinCard(sel,c)}</ul>`:""}
   <div class="acts" style="margin-top:12px">
    ${route.length>1?`<a class="chip go" style="--c:var(--map)" href="${esc(routeUrl)}" target="_blank" rel="noopener">${ico("map")}Open ${route.length} stops in Google Maps</a>`:""}
    ${untried.length&&(S.geo||S.ai)&&!S.places?`<button class="chip" data-act="locate" ${S.busy.locate?"disabled":""}>${ico("spark")}${S.busy.locate?"Placing…":"Place "+untried.length+" more on the map"}</button>`:""}

/* ---------- Map (Leaflet + free tiles) ----------
   Satellite = Esri World Imagery with street and place names drawn on top. Streets = OpenStreetMap.
   Leaflet lives in one element that we re-attach after every render, so it keeps its zoom and position. */
const TILES={
  osm:{url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",o:{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}},
  img:{url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19,maxNativeZoom:18,attribution:"Imagery, roads and place names © Esri, Maxar, Earthstar Geographics and the GIS User Community"}},
  place:{url:"https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19,maxNativeZoom:17,zIndex:2}},
  road:{url:"https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",o:{maxZoom:19,maxNativeZoom:17,zIndex:3}}
};
const MAP={el:null,map:null,layers:[],markers:[],style:LS.get("jj_mapstyle")==="streets"?"streets":"sat",fitKey:""};
let MAPPTS=[];
function setMapStyle(k,persist=true){
  MAP.style=k;if(persist)LS.set("jj_mapstyle",k);
  if(!MAP.map)return;
  MAP.layers.forEach(l=>MAP.map.removeLayer(l));MAP.layers=[];
  const add=t=>{const l=L.tileLayer(t.url,t.o);l.addTo(MAP.map);MAP.layers.push(l);return l};
  if(k==="streets"){add(TILES.osm);return}
  const base=add(TILES.img);let ok=0,bad=0;
  base.on("tileload",()=>{ok++});
  base.on("tileerror",()=>{   // Esri's free tiles are a legacy service. If they stop loading, fall back to streets by ourselves.
    bad++;

  });

}
function syncMarkers(pts){

function fitMap(c,pts){   // only move the view when what it should show has changed, never on ordinary re-renders
  const key=[c.id,S.mapFilter,pts.map(p=>p.id+":"+p.lat+":"+p.lng).join(","),c.area?"a":"",c.geo?"g":""].join("|");
  if(key===MAP.fitKey)return;MAP.fitKey=key;

const AREA_BUSY=new Set();
async function osmArea(c){   // the city's outline box from OpenStreetMap
  const base="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(wikiQuery(c.name));
  let rows=await nomJSON(base+"&featuretype=city");if(!rows||!rows.length)rows=await nomJSON(base);
  const r=rows&&rows[0];if(!r)return null;
  const geo=isFinite(+r.lat)&&isFinite(+r.lon)?{lat:+(+r.lat).toFixed(5),lng:+(+r.lon).toFixed(5)}:null;
  let area=null;
  if(Array.isArray(r.boundingbox)){const [s,n,w,e]=r.boundingbox.map(Number);
    if([s,n,w,e].every(isFinite)&&n-s<2&&e-w<2.5)area={s:+s.toFixed(4),n:+n.toFixed(4),w:+w.toFixed(4),e:+e.toFixed(4)}}   // ignore absurdly large results
  return {area,geo};
}
async function ensureCityArea(c){
  if(!S.geo||c.area||c.areaTried||AREA_BUSY.has(c.id))return;
  AREA_BUSY.add(c.id);
  try{
    const r=await osmArea(c),up={areaTried:true};
    if(r){if(r.area)up.area=r.area;if(r.geo&&!c.geo)up.geo=r.geo}
    await store.updateCity(c.id,up);
  }catch{/* offline or blocked: try again next time */}
  finally{AREA_BUSY.delete(c.id)}
}
async function locate(list){
  const c=city();if(!c||!S.ai||!list.length)return;
  const names=list.map(p=>p.title);
  try{
    const res=await aiJSON(`For each place in or near ${c.name}, give its approximate latitude and longitude. Places: ${JSON.stringify(names)}. Reply with only a JSON array in the same order, one object per place: {"name": string, "lat": number or null, "lng": number or null}. Use null when you are not confident the place exists or where it is.`);
    if(!Array.isArray(res))return;
    for(let i=0;i<list.length;i++){const r=res[i]||{},lat=num(r.lat),lng=num(r.lng);
      try{await store.updatePin(c.id,list[i].id,lat!==null&&lng!==null?{lat,lng,geoTried:true}:{geoTried:true})}catch{}}
  }catch{}
}

/* ---------- Free map positions (OpenStreetMap) and city photos (Wikipedia / Wikimedia Commons) ----------
   No keys and no accounts; requests go straight from the browser. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const GEO_GAP=window.GEO_GAP_MS||1100;   // OpenStreetMap's Nominatim policy: at most one request per second
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
let nomNext=0;
async function nomJSON(u){const now=Date.now(),at=Math.max(now,nomNext);nomNext=at+GEO_GAP;if(at>now)await sleep(at-now);return getJSON(u)}
async function osmFind(title,c){
  const ck="jj_osm:"+c.id+":"+String(title).toLowerCase(),hit=LS.get(ck);
  if(hit)return hit==="none"?null:JSON.parse(hit);
  const g0=c.geo&&typeof c.geo.lat==="number"?c.geo:null,d=.4;   // stay within ~25 miles of the city so we never pin the wrong Springfield
  const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(title+", "+c.name)
    +(g0?`&viewbox=${(g0.lng-d).toFixed(4)},${(g0.lat+d).toFixed(4)},${(g0.lng+d).toFixed(4)},${(g0.lat-d).toFixed(4)}&bounded=1`:"");
  const rows=await nomJSON(u),r=rows&&rows[0];
  const out=r&&isFinite(+r.lat)&&isFinite(+r.lon)?{lat:+(+r.lat).toFixed(5),lng:+(+r.lon).toFixed(5)}:null;
  LS.set(ck,out?JSON.stringify(out):"none");
  return out;
}
let geoChain=Promise.resolve();
function placePins(list){geoChain=geoChain.then(()=>doPlace(list)).catch(()=>{});return geoChain}
async function doPlace(list){
  const aiLeft=[];
  for(const p of list){
    const cid=p.cid||S.cityId,c=S.cities.find(x=>x.id===cid);if(!c)continue;
    if(!["eat","play","see"].includes(p.cat)){try{await store.updatePin(cid,p.id,{geoTried:true})}catch{}continue}   // events/games aren't places
    let r=null,down=false;
    if(S.geo){try{r=await osmFind(p.title,c)}catch{down=true}}
    try{
      if(r)await store.updatePin(cid,p.id,{lat:r.lat,lng:r.lng,geoTried:true,geoSrc:"osm"});
      else if(!down&&S.ai)aiLeft.push({id:p.id,title:p.title});
      else if(!down)await store.updatePin(cid,p.id,{geoTried:true});   // if the lookup itself failed, leave it to try again later
    }catch{}
  }
  if(aiLeft.length)await locate(aiLeft);
}

const STATES={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia"};
function wikiQuery(name){   // "Salem MA" -> "Salem, Massachusetts"
  const n=String(name).trim(),m=n.match(/^(.*?)[,\s]+([A-Za-z]{2})\.?$/);
  return m&&STATES[m[2].toUpperCase()]?m[1].trim()+", "+STATES[m[2].toUpperCase()]:n;
}
const noTags=s=>String(s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
const WAPI="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&";
const CAPI="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&";
const fileUrl=f=>"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(String(f).replace(/ /g,"_"));
const urlKey=u=>{try{return decodeURIComponent(u).toLowerCase()}catch{return String(u).toLowerCase()}};
const creditOf=m=>[noTags(m&&m.Artist&&m.Artist.value).slice(0,60),noTags(m&&m.LicenseShortName&&m.LicenseShortName.value)].filter(Boolean).join(", ")||"Wikimedia Commons";
async function wikiFind(name){
  const j=await getJSON(WAPI+"generator=search&gsrnamespace=0&gsrlimit=5&gsrsearch="+encodeURIComponent(wikiQuery(name))+"&prop=pageimages|coordinates&piprop=thumbnail|name&pithumbsize=1400&pilimit=5&coprimary=primary&colimit=5");
  const pages=Object.values(j&&j.query&&j.query.pages||{}).sort((a,b)=>(a.index||99)-(b.index||99));
  const p=pages.find(x=>x.coordinates&&x.coordinates.length);   // only accept real places
  return p?{title:p.title,lat:p.coordinates[0].lat,lng:p.coordinates[0].lon,thumb:p.thumbnail&&p.thumbnail.source||"",file:p.pageimage||""}:null;
}
async function fileCredit(file){
  try{
    const j=await getJSON(CAPI+"prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist|LicenseShortName&titles="+encodeURIComponent("File:"+file));
    const pg=Object.values(j&&j.query&&j.query.pages||{})[0],ii=pg&&pg.imageinfo&&pg.imageinfo[0];
    return creditOf(ii&&ii.extmetadata);
  }catch{return "Wikimedia Commons"}
}
async function commonsPhotos(title){
  const j=await getJSON(CAPI+"generator=search&gsrnamespace=6&gsrlimit=30&gsrsearch="+encodeURIComponent(title+" skyline")+"&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=1400&iiextmetadatafilter=Artist|LicenseShortName");
  return Object.values(j&&j.query&&j.query.pages||{}).sort((a,b)=>(a.index||99)-(b.index||99)).map(pg=>{
    const ii=pg.imageinfo&&pg.imageinfo[0];if(!ii||ii.mime!=="image/jpeg"||!ii.thumburl)return null;
    const r=ii.width/ii.height;if(ii.width<1600||r<1.3||r>3.2)return null;   // wide, high-res photos only
    return {type:"wiki",url:ii.thumburl,credit:creditOf(ii.extmetadata),creditUrl:ii.descriptionurl||fileUrl(String(pg.title).replace(/^File:/,""))};
  }).filter(Boolean);
}
const PHOTO_C={},PHOTO_BUSY=new Set();
async function photoCandidates(c){
  const k=c.id+"|"+c.name;if(PHOTO_C[k])return PHOTO_C[k];
  const f=await wikiFind(c.name);if(!f)return {geo:null,list:[]};
  const list=[];
  if(f.thumb&&f.file)list.push({type:"wiki",url:f.thumb,credit:await fileCredit(f.file),creditUrl:fileUrl(f.file)});
  try{for(const x of await commonsPhotos(f.title))if(!list.some(y=>urlKey(y.creditUrl)===urlKey(x.creditUrl)))list.push(x)}catch{}
  return PHOTO_C[k]={geo:{lat:f.lat,lng:f.lng},list:list.slice(0,12)};
}
async function ensureCityPhoto(c){   // runs once per trip; the result is saved so the whole family shares it
  if(!S.photos||c.photo||c.photoTried||PHOTO_BUSY.has(c.id))return;
  PHOTO_BUSY.add(c.id);
  try{
    const r=await photoCandidates(c),up={photoTried:true};
    if(r.geo)up.geo=r.geo;
    if(r.list.length)up.photo={...r.list[0],i:0};
    await store.updateCity(c.id,up);
  }catch{/* offline or blocked: try again next time */}
  finally{PHOTO_BUSY.delete(c.id)}
}
async function nextCityPhoto(c){
  const r=await photoCandidates(c);
  if(r.list.length<2){toast("No other photos found.");return}
  const i=((c.photo&&typeof c.photo.i==="number"?c.photo.i:-1)+1)%r.list.length;
  await store.updateCity(c.id,{photo:{...r.list[i],i}});
}

/* ---------- Claude-powered lists ---------- */
async function runAI(kind){
  const c=city();if(!c||!S.ai||S.busy[kind])return;
  S.busy[kind]=true;render();
  const s=c.start||today(),e=c.end||s;
  const geo=`"lat": number or null, "lng": number or null (approximate coordinates; null if unsure)`;
  let prompt;
  if(kind.startsWith("eat_")){const st=EAT_STYLES.find(x=>"eat_"+x.k===kind);
    prompt=`You are a food-obsessed local. List 10 of ${st.q} in ${c.name}. Only include places you are confident are real and long-running. Reply with only a JSON array of objects: {"name": string, "kind": string (cuisine and price like "Seafood, $$$"), "why": string (at most 14 words, name a dish if you can), "area": string (neighborhood), ${geo}}.`}
  else if(kind==="play")prompt=`List 10 of the best entertainment spots in ${c.name} for adults: live music venues, comedy clubs, theaters, rooftop and cocktail bars, and nightlife. Only well-established places. Reply with only a JSON array of objects: {"name": string, "kind": string (e.g. "Jazz club"), "why": string (at most 14 words), "area": string (neighborhood), ${geo}}.`;
  else if(kind==="see")prompt=`You are a well-traveled local guide. List the 12 most popular and worthwhile things to see and do in ${c.name}: landmarks, museums, neighborhoods, outdoors, markets and local favorites. Reply with only a JSON array of objects: {"name": string, "why": string (at most 14 words, specific), "area": string (neighborhood), ${geo}}.`;
  else prompt=`Which recurring annual festivals, seasonal events, holiday traditions and big yearly happenings usually take place in or near ${c.name} between ${fmt(s,{month:"long",day:"numeric"})} and ${fmt(e,{month:"long",day:"numeric"})}? Only events that recur every year and typically overlap that window. Up to 8. Reply with only a JSON array of objects: {"name": string, "typical_timing": string (e.g. "Usually the second weekend of October"), "why": string (at most 14 words)}. Reply [] if none.`;
  try{
    const items=await aiJSON(prompt);
    if(!Array.isArray(items))throw{code:"invalid_json"};
    setTimeout(()=>loadCity().catch(()=>{}),45000);setTimeout(()=>loadCity().catch(()=>{}),90000);
    await store.setLive(c.id,kind,{items:items.slice(0,15).map(x=>({name:String(x.name||""),kind:String(x.kind||""),why:String(x.why||""),area:String(x.area||""),typical_timing:String(x.typical_timing||""),lat:num(x.lat),lng:num(x.lng)})).filter(x=>x.name),at:Date.now()});
  }catch(err){
    toast(aiErrText(err,"Couldn't load the list. Try again."));
  }finally{S.busy[kind]=false;render()}
}

  if(a==="savePin"){
    const title=$("#p-title").value.trim();if(!title){$("#p-title").focus();return}
    let url=$("#p-url").value.trim();if(url&&!/^https?:\/\//i.test(url))url="https://"+url;
    try{await addPin(c,{cat:el.dataset.k,title,note:$("#p-note").value.trim(),url,when:$("#p-when")?.value.trim()||""});closeSheet();toast("Pinned")}catch{toast("Couldn't save. You may need edit access.")}
    return;
  }
  if(a==="status"){const p=S.pins.find(x=>x.id===el.dataset.id);if(p)try{await store.updatePin(c.id,p.id,{status:p.status==="loved"?"want":"loved"})}catch{toast("Couldn't update.")}return}
  if(a==="delPin"){const p=S.pins.find(x=>x.id===el.dataset.id);if(p&&confirm(`Remove ${p.title}?`))try{if(S.mapSel===p.id)S.mapSel=null;await store.delPin(c.id,p.id)}catch{toast("Couldn't remove.")}return}
  if(a==="ai")return runAI(el.dataset.kind);
  if(a==="refresh")return refreshLive(el.dataset.kind);
  if(a==="newPhoto"){S.busy.photo=true;render();try{await nextCityPhoto(c)}catch{toast("Couldn't find another photo. Check your connection.")}finally{S.busy.photo=false;render()}return}
  if(a==="setupOpen")return setupSheet();
  if(a==="saveSetup"){
    const name=$("#s-name").value.trim(),code=($("#s-code")?.value||"").trim(),key=($("#s-key")?.value||"").trim();
    if(!name){$("#s-name").focus();return}
    if(!code&&!API.fid){$("#s-code").focus();return}
    if(code&&code.length<8){toast("Use a code that's at least 8 characters.");return}
    if(key&&!/^sk-/.test(key)){toast("That doesn't look like an Anthropic key. It starts with sk-ant-.");return}
    API.name=name;LS.set("jj_name",name);
    let fid,ck;
    if(code){toast("Checking the code…");try{fid=await familyIdFor(code);ck=await familyKeyFor(code,fid)}catch{toast("This browser can't check the code. Open the site over https.");return}}
    if(key){
      const useCk=ck||LS.get("jj_ck");
      if(fid&&fid!==API.fid){toast("Switch to that family first, then add the key.");return}
      if(!useCk){toast("Enter the family code above too, so the key can be locked with it.");return}
      try{await saveSharedKey(key,useCk,fid||API.fid)}catch(e){toast(errText(e));return}
      toast("Shared key saved for the whole family");
    }
    closeSheet();lastCities="";start(fid,ck);return;
  }
  if(a==="clearKey"){
    if(!confirm("Remove the shared Anthropic key? AI suggestions will turn off for the whole family."))return;
    try{await commit(FB.deleteDoc(settingsRef()));closeSheet();toast("Shared key removed for everyone")}catch{toast("Couldn't remove it. Try again.")}
    return;
  }
  if(a==="cancelCreate"){setupSheet();return}
  if(a==="createFamily"){
    el.disabled=true;el.textContent="Creating…";
    try{await createFamily(PENDING_FID);closeSheet();enterFamily(PENDING_FID,PENDING_CK)}
    catch(e){el.disabled=false;el.textContent="Create family space";toast(errText(e))}
    return;
  }
  if(a==="pinTeam")return pinSheet("games",{title:el.dataset.t+" home game"});
  if(a==="pinFrom"){
    const src=el.dataset.src;let data;
    const day=it=>fmt(it.date,{weekday:"short",month:"short",day:"numeric"})+(it.time?", "+it.time:"");
    if(src==="annual"){const it=S.live.annual.items[+el.dataset.i];data={cat:"events",title:it.name,when:it.typical_timing,note:it.why}}
    else if(src==="events"){const it=S.live.events.items.find(e=>e.name+e.date===el.dataset.id);data={cat:"events",title:it.name,when:day(it),note:it.venue||"",url:it.url||""}}
    else if(src==="games"){const it=S.live.games.items.find(e=>e.matchup+e.date===el.dataset.id);data={cat:"games",title:it.matchup,when:day(it),note:[it.league,it.venue].filter(Boolean).join(", "),url:it.url||""}}
    else{const it=S.live[src].items[+el.dataset.i],cat=src.startsWith("eat")?"eat":src;data={cat,title:it.name,note:[it.kind,it.why].filter(Boolean).join(". ")};
      for(const f of ["placeId","website","rating","mapsUrl","photoCredit","hasPhoto","menuUrl","menuTried","enriched"])if(it[f]!==undefined&&it[f]!==null&&it[f]!=="")data[f]=it[f];if(it.lat!==null&&it.lng!==null&&typeof it.lat==="number"){data.lat=it.lat;data.lng=it.lng;data.geoTried=true}}
    if(S.pins.some(p=>p.cat===data.cat&&p.title===data.title)){toast("Already pinned");return}
    try{await addPin(c,data);toast("Pinned")}catch{toast("Couldn't save. You may need edit access.")}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- Start ---------- */
function enterFamily(fid,ck){
  if(fid!==API.fid){S.cities=[];S.pins=[];S.live={};S.cityId=null;lastCities="";lastCity="";CITYDOCS={};AIKEY="";S.ai=false;S.aiInfo=null;S.aiLocked=false;if(!ck)LS.set("jj_ck","")}   // a different family: drop the old family's secret
  API.fid=fid;LS.set("jj_fid",fid);if(ck)LS.set("jj_ck",ck);S.err="";subscribe();
}
async function start(newFid,newCk){
  try{localStorage.removeItem("jj_akey")}catch{}   // an earlier build kept the key per device; it now lives (encrypted) in the family data
  S.ai=!!AIKEY;S.places=false;S.geo=true;S.photos=true;S.needsCode=true;
  const fid=newFid||API.fid;
  if(!API.name||!fid){S.ready=true;render();setupSheet();return}
  try{
    if(!(await familyExists(fid))){
      if(newFid){S.ready=true;render();createSheet(fid,newCk);return}
      API.fid="";LS.set("jj_fid","");S.ready=true;render();setupSheet("That family space wasn't found. Enter your code again.");return;
    }
  }catch(e){S.err=errText(e);S.ready=true;render();return}
  enterFamily(fid,newCk);
}
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
render();start();
</script>
</body>
